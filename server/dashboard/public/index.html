<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据看板 · 一堂课</title><link rel="stylesheet" href="/dashboard/style.css"></head>
<body data-active="dashboard"><main><header><div><h1>数据看板</h1><p>课堂参与、作业进展与学生反馈，一屏掌握关键变化。</p></div><div class="header-actions"><span id="syncTime">正在读取数据</span><button id="refresh"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 8a8 8 0 1 0 0 8M20 3v5h-5"/></svg> 刷新数据</button></div></header>
<section class="filters" aria-label="统计筛选"><label>课程<select id="course"><option value="all">全部课程</option></select></label><label>学期<select id="term"><option value="all">全部学期</option></select></label><label>活动日期<select id="period"><option value="30">近30天</option><option value="7">近7天</option><option value="all">全部</option><option value="custom">自定义</option></select></label><div id="customDates" hidden><input aria-label="开始日期" id="from" type="date"><span>至</span><input aria-label="结束日期" id="to" type="date"></div><span class="filter-note">存量指标按当前统计</span></section><p id="dateError" class="error" role="alert" hidden></p>
<div id="loadError" class="error" role="alert" hidden></div><div id="content" aria-busy="true"><section class="panel empty"><p>正在读取教学数据…</p></section></div>
<footer><span>教师端 · 只读统计 · 数据保存在本机</span><span>当前名单与历史名单可能存在差异</span></footer></main>
<div id="toast" role="status" hidden></div><script src="/shell.js"></script><script src="/dashboard/view.js"></script><script src="/dashboard/app.js"></script></body></html>
