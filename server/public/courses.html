  const res=await fetch(url,body===undefined?{}:{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data=await res.json();if(!res.ok)throw new Error(data.error||'操作失败，请重试');return data;

document.addEventListener('click',e=>{if(locked&&e.target.closest('a'))e.preventDefault()},true);
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3500)}
function card(c,i){return `<article class="course"><div class="card-top"><div class="course-row"><span class="course-icon ${i===1?'teal':i===2?'amber':''}" aria-hidden="true">▤</span><span class="tag ${c.ready?'':'pending'}">${c.ready?'已就绪':'待录入名单'}</span></div><h2><a href="#edit/${c.id}">${esc(c.name)}</a></h2><div class="term">${esc(c.term||'未填写学期')}</div><div class="metrics"><div class="metric"><b>${c.count}</b><span>人</span><small>课程名单</small></div><div class="metric"><b>${c.sessions}</b><span>次</span><small>签到记录</small></div></div></div><div class="card-bottom"><span>${c.ready?'基本信息与名单已准备':'补充名单，完成课程准备'}</span><a href="#edit/${c.id}">${c.ready?'管理课程':'继续完善'}</a></div></article>`}
function renderList(){const list=courses.filter(c=>(term==='all'||c.term===term)&&c.name.toLowerCase().includes(search.toLowerCase()));$('view').innerHTML=`<header class="head"><div><h1>课程管理</h1><p class="desc">从课程开始，把每一堂课准备好。</p></div><a class="primary" href="#new" style="padding:10px 16px;border-radius:8px;font-size:13px">＋ 新建课程</a></header><div class="toolbar"><div class="search"><span aria-hidden="true">⌕</span><input id="search" aria-label="搜索课程" placeholder="搜索课程名称" value="${esc(search)}"></div><select id="term" aria-label="筛选学期"><option value="all">全部学期</option>${[...new Set(courses.map(c=>c.term).filter(Boolean))].map(t=>`<option ${term===t?'selected':''}>${esc(t)}</option>`).join('')}</select><span class="count">共 ${list.length} 门课程</span></div><div class="grid">${list.map(card).join('')||'<p class="empty">没有符合条件的课程。</p>'}</div><div class="list-note"><span>ⓘ</span><span>课程信息与名单在这里统一维护；签到、作业与学情分析会关联到对应课程。</span></div>`;$('search').oninput=e=>{search=e.target.value;const start=e.target.selectionStart;renderList();$('search').focus();$('search').setSelectionRange(start,start)};$('term').onchange=e=>{term=e.target.value;renderList()}}
async function begin(id,version){selected=id?courses.find(c=>c.id===id):null;if(id&&!selected)throw new Error('课程不存在或已删除');
 draft=selected?JSON.parse(JSON.stringify(selected)):{name:'',term:'',note:'',students:[],count:0,sessions:0,assignments:0,ready:false};
 if(selected){const data=await api('/api/students?courseId='+encodeURIComponent(id));if(version!==routeVersion)return;draft.students=data.students.map(s=>[s.id,s.name])}
 step=1;method='upload';uploadName='';rosterText='';renderEditor();
}
function steps(){return `<div class="flow-navigation"><nav class="flow-steps" aria-label="课程准备步骤">${['基本信息','名单录入','确认完成'].map((n,i)=>`<button class="flow-step ${step===i+1?'active':i+1<step?'complete':''}" data-step="${i+1}" ${step===i+1?'aria-current="step"':''}><i class="flow-number">${i+1}</i>${n}</button>`).join('')}</nav></div>`}
function basic(){return `<div class="panel-title"><div><h2>基本信息</h2><p>先为这门课建立清晰的身份。</p></div><span class="step-count">第 1 / 3 步</span></div><div class="form-grid"><div><label for="name">课程名称<span class="required">*</span></label><input id="name" value="${esc(draft.name)}" placeholder="例如：高等数学（上）" maxlength="80"><p class="helper">名称会显示在签到、作业和学情分析中。</p></div><div><label for="semester">学期<span class="required">*</span></label><input id="semester" value="${esc(draft.term)}" placeholder="例如：2026 秋" maxlength="40"><p class="helper">便于区分同一门课在不同学期的记录。</p></div><div class="wide"><label for="note">课程备注 <span style="font-weight:400;color:#9aa4b1">（可选）</span></label><textarea id="note" placeholder="记录课程的教学对象或其他说明" maxlength="300">${esc(draft.note)}</textarea></div></div><div id="formError" class="error" role="alert"></div><div class="notice"><span>ⓘ</span><span>修改课程信息后，名单及已有记录仍关联到这门课。</span></div>`}

function uploadArea(compact=false){return `<div class="roster-drop ${compact?'compact':''}" id="rosterDrop" role="button" tabindex="0" aria-label="点击或拖拽上传学生名单"><span class="upload-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17H5a4 4 0 0 1-.6-7.95 7 7 0 0 1 13.4 0A4 4 0 0 1 19 17h-2M12 20V10m-4 4 4-4 4 4"/></svg></span><div class="upload-copy"><strong id="uploadTitle">上传学生名单</strong><p id="uploadHint">点击或将表格拖到此处<br>支持 .xlsx / .csv · 前两列为学号、姓名 · 最大20MB</p></div></div><input id="file" type="file" accept=".xlsx,.csv" hidden aria-label="选择名单表格"><div id="uploadSelected" class="upload-selected ${uploadName?'':'hidden'}" role="status"><span id="uploadName">${esc(uploadName)}</span><small>已处理</small></div><div id="uploadError" class="upload-error" role="alert"></div>`}
function bindUpload(){
 if($('roster')){$('roster').value=rosterText;$('roster').oninput=()=>rosterText=$('roster').value}if(!$('rosterDrop'))return;const zone=$('rosterDrop'),input=$('file');let depth=0;
 const choose=files=>{if(locked||!files?.length)return;const f=files[0];$('uploadError').textContent='';if(files.length!==1){$('uploadError').textContent='请一次选择一份名单表格。';return}if(!/\.(xlsx|csv)$/i.test(f.name)){$('uploadError').textContent='请选择xlsx或csv文件。';return}if(f.size>20*1024*1024){$('uploadError').textContent='文件不能超过20MB。';return}
 busy(async()=>{const id=draft.id;const bytes=new Uint8Array(await f.arrayBuffer());let bin='';for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode(...bytes.subarray(i,i+8192));const result=await api('/api/students/upload',{courseId:id,fileName:f.name,fileBase64:btoa(bin)});uploadName=f.name;await refreshRoster(id);renderEditor();showImport(result)})};
 zone.onclick=()=>{if(!locked)input.click()};zone.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();if(!locked)input.click()}};input.onchange=()=>{choose(input.files);input.value=''};
 zone.ondragenter=e=>{e.preventDefault();if(!locked){depth++;zone.classList.add('dragging')}};zone.ondragover=e=>{e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect=locked?'none':'copy'};zone.ondragleave=e=>{e.preventDefault();if(--depth<=0){depth=0;zone.classList.remove('dragging')}};zone.ondrop=e=>{e.preventDefault();depth=0;zone.classList.remove('dragging');choose(e.dataTransfer?.files)};
}
async function refreshRoster(id){const data=await api('/api/students?courseId='+encodeURIComponent(id));draft.students=data.students.map(s=>[s.id,s.name]);draft.count=data.students.length;draft.ready=draft.count>0;if(selected){selected.students=draft.students;selected.count=draft.count;selected.ready=draft.ready}}
function showImport(result){rosterText=(result.bad||[]).join('\n');if($('roster'))$('roster').value=rosterText;toast('新增 '+result.ok+' 人，跳过 '+result.skipped+' 行，现有 '+result.total+' 人');if(result.bad?.length)$('rosterError').textContent='未导入（重复学号或格式错误）：'+result.bad.slice(0,20).join('；')+(result.bad.length>20?'；其余错误行已保留在粘贴名单中。':'')}
async function removeStudent(index){const row=draft.students[index];if(!row)return;await busy(async()=>{const id=draft.id;await api('/api/students/'+encodeURIComponent(row[0]||row.id)+'?courseId='+encodeURIComponent(id),{},'DELETE');await refreshRoster(id);renderEditor();toast('已移除学生，历史记录保留')})}
function roster(){return `<div class="panel-title"><div><h2>名单录入</h2><p>导入学生名单，也可以稍后补充。</p></div><span class="step-count">第 2 / 3 步</span></div><div class="method-tabs" role="group" aria-label="名单录入方式"><button id="uploadTab" class="${method==='upload'?'active':''}">上传表格</button><button id="pasteTab" class="${method==='paste'?'active':''}">粘贴名单</button></div>${method==='paste'?`<label for="roster">学号与姓名</label><textarea class="roster-area" id="roster" placeholder="20260001 示例同学甲&#10;20260002 示例同学乙"></textarea><p class="helper">每行一位学生，支持逗号、空格或 Tab 分隔。</p><div class="roster-toolbar"><p>已存在的学号会提示核对，避免重复录入。</p><button id="preview" style="font-size:12px">预览并加入名单</button></div>`:uploadArea()}<div id="rosterError" class="error" role="alert"></div><div style="display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px"><h3 style="margin:0">当前名单</h3><span style="font-size:12px;color:#8592a4">共 ${draft.count} 人${draft.count>draft.students.length?'':''}</span></div><div class="table-wrap"><table><thead><tr><th>学号</th><th>姓名</th><th style="text-align:right">操作</th></tr></thead><tbody>${draft.students.map((s,i)=>`<tr><td>${esc(s[0])}</td><td>${esc(s[1])}</td><td style="text-align:right"><button class="link" data-remove="${i}">移除</button></td></tr>`).join('')||'<tr><td colspan="3" class="empty">还没有名单，录入后会在这里预览。</td></tr>'}</tbody></table></div>`}
function review(){return `<div class="panel-title"><div><h2>确认课程</h2><p>最后检查一下，接下来就可以开始教学。</p></div><span class="step-count">第 3 / 3 步</span></div><div class="confirm-grid"><section class="review-block"><div class="section-title"><h3 style="margin:0">基本信息</h3><button class="link" data-step="1">修改</button></div><dl><dt>课程名称</dt><dd>${esc(draft.name)}</dd><dt>学期</dt><dd>${esc(draft.term)}</dd><dt>课程备注</dt><dd>${esc(draft.note||'未填写')}</dd></dl></section><section class="review-block"><div class="section-title"><h3 style="margin:0">课程名单</h3><button class="link" data-step="2">修改</button></div><div class="review-count">${draft.count}<small>名学生</small></div><p class="helper">${draft.count?'名单已准备，可以用于签到和作业匹配。':'本次仅保存课程信息，可随时回来补充名单。'}</p><div class="okline">${draft.count?'✓ 名单已录入':'○ 待补充名单'}</div></section></div><div class="notice"><span>ⓘ</span><span>完成后返回课程卡片。后续仍可进入课程，修改信息或维护名单。</span></div>`}
function renderEditor(){if(selected)return renderManage();const title=selected?'管理课程':'新建课程';$('view').innerHTML=`<div class="breadcrumb"><a href="#list">课程管理</a><span>/</span><span>${selected?esc(draft.name):title}</span></div><header class="head" style="margin-bottom:0"><div><h1>${title}</h1><p class="desc">${selected?esc(draft.name)+' · '+esc(draft.term):'按步骤填写基本信息、录入名单，完成课程准备。'}</p></div><a class="link" href="#list">返回课程列表 ↗</a></header>${steps()}<div class="editor-layout"><div><section class="panel">${step===1?basic():step===2?roster():review()}</section><div class="actions"><div><button id="back">${step===1?'取消':'← 上一步'}</button>${step===2?'<button class="link" id="skip">稍后录入名单</button>':'<span class="hint">基本信息将在进入下一步时保存</span>'}</div><button class="primary" id="next">${step===1?'下一步：名单录入 →':step===2?'下一步：确认课程 →':'完成并返回课程列表'}</button></div></div><aside class="side-info"><h3>课程准备</h3><p>从一门课出发，连接名单、课堂与课后作业。</p><div class="info-line"><span>基本信息</span><strong>${draft.name?'已填写':'待填写'}</strong></div><div class="info-line"><span>学生名单</span><strong>${draft.count?draft.count+' 人':'待录入'}</strong></div><div style="height:1px;background:#e5eaf1;margin:20px 0"></div><p>完成后可继续<br>发起签到 · 管理作业 · 查看学情</p></aside></div>`;document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>goStep(Number(b.dataset.step)));$('back').onclick=()=>step===1?location.hash='list':goStep(step-1);$('next').onclick=()=>step<3?goStep(step+1):finish();if($('skip'))$('skip').onclick=()=>goStep(3);if($('preview'))$('preview').onclick=preview;if($('pasteTab')){$('pasteTab').onclick=()=>{method='paste';renderEditor()};$('uploadTab').onclick=()=>{method='upload';renderEditor()}}bindUpload();document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeStudent(Number(b.dataset.remove)))}
async function goStep(n){if(locked)return;
 if(step===1){draft.name=$('name').value.trim();draft.term=$('semester').value.trim();draft.note=$('note').value.trim();if(n!==1&&(!draft.name||!draft.term)){$('formError').textContent='请填写课程名称和学期。';return}
 if(n>1){await busy(async()=>{const body={name:draft.name,term:draft.term,note:draft.note};const c=await api(draft.id?'/api/courses/'+encodeURIComponent(draft.id):'/api/courses',body,draft.id?'PUT':'POST');draft.id=c.id;await loadCourses();step=n;renderEditor()});return}}
 if(step===2&&$('roster')?.value.trim()){toast('请先加入名单，避免遗漏当前输入。');return}step=n;renderEditor();
}
async function preview(){if(locked)return;const text=$('roster').value;if(!text.trim()){toast('请先粘贴名单');return}await busy(async()=>{const id=draft.id;const result=await api('/api/students/import',{courseId:id,text});await refreshRoster(id);renderEditor();showImport(result)})}
async function finish(){if(locked)return;await loadCourses();location.hash='list';toast('课程已准备好，可随时继续维护')}
function renderManage(){
  $('view').innerHTML=`<div class="breadcrumb"><a href="#list">课程管理</a><span>/</span><span>${esc(draft.name)}</span></div>
  <header class="head manage-head"><div><h1>${esc(draft.name)}</h1><p class="desc">${esc(draft.term)} · 课程概览与维护</p></div><a class="link" href="#list">返回课程列表 ↗</a></header>
  <div class="manage-summary"><div class="manage-stat"><small>课程名单</small><b>${draft.count}</b><span>人</span></div><div class="manage-stat"><small>签到记录</small><b>${draft.sessions}</b><span>次</span></div><div class="manage-stat"><small>课程作业</small><b>${draft.assignments||0}</b><span>份</span></div><div class="manage-stat"><small>准备状态</small><b class="state manage-status ${draft.count?'':'pending'}">${draft.count?'已就绪':'待录入名单'}</b></div></div>
  <div class="manage-grid"><section class="panel"><div class="panel-title"><div><h2>课程名单</h2><p>上传或粘贴补充名单，在下方核对学生。</p></div><span class="tag ${draft.count?'':'pending'}">${draft.count} 人</span></div>
  <div class="method-tabs" role="group" aria-label="名单录入方式"><button id="uploadTab" class="${method==='upload'?'active':''}">上传表格</button><button id="pasteTab" class="${method==='paste'?'active':''}">粘贴名单</button></div>
  ${method==='upload'?uploadArea(true):`<label for="roster">学号与姓名</label><textarea class="manage-paste" id="roster" placeholder="20260001 示例甲&#10;20260002 示例乙"></textarea><div class="roster-toolbar"><p>每行一位，支持逗号、空格或 Tab。</p><button id="preview" style="font-size:12px;padding:6px 10px">预览并加入名单</button></div>`}
  <div class="error" id="rosterError" role="alert"></div><div class="manage-inline" style="justify-content:space-between;margin:16px 0 10px"><h3 style="font-size:12px;margin:0">学生名单</h3><span style="font-size:11px;color:#92a0b0">${draft.count>draft.students.length?'展示 '+draft.students.length+' / '+draft.count+' 人':'共 '+draft.count+' 人'}</span></div>
  <div class="table-wrap"><table><thead><tr><th>学号</th><th>姓名</th><th style="text-align:right">操作</th></tr></thead><tbody>${draft.students.map((s,i)=>`<tr><td>${esc(s[0])}</td><td>${esc(s[1])}</td><td style="text-align:right"><button class="link" data-remove="${i}">移除</button></td></tr>`).join('')||'<tr><td colspan="3" class="empty">暂无名单，可先上传表格。</td></tr>'}</tbody></table></div>
  <p class="helper" style="margin-top:10px">上传后自动加入有效名单，重复学号和格式错误会单独提示。</p></section>
  <div class="manage-right"><section class="panel"><div class="panel-title"><h2>基本信息</h2><span style="font-size:11px;color:#929daa">可直接编辑</span></div><div class="form-grid"><div class="wide"><label for="name">课程名称</label><input id="name" maxlength="80" value="${esc(draft.name)}"></div><div class="wide"><label for="semester">学期</label><input id="semester" maxlength="40" value="${esc(draft.term)}"></div><div class="wide"><label for="note">课程备注 <span style="color:#9aa4b1">（可选）</span></label><textarea id="note" maxlength="300" placeholder="记录教学对象或其他说明">${esc(draft.note)}</textarea></div></div><div class="error" role="alert" id="formError"></div><div class="manage-save"><span class="helper">修改后保存即可生效</span><button class="primary" id="saveManage">保存信息</button></div></section>
  <section class="danger-zone"><div class="danger-top"><div><h3>删除课程</h3><p class="helper" style="margin-top:3px">移除前请核对课程及关联数据。</p></div><button class="danger" id="deleteCourse">删除课程</button></div><div class="delete-confirm hidden" id="deleteConfirm"><p>确认删除「${esc(selected.name)}」？该课程当前有 ${selected.count} 名学生、${selected.sessions} 次签到记录。<br>删除后将隐藏课程及其作业，原始名单、签到记录和文件会保留。</p><div class="buttons"><button id="cancelDelete" style="font-size:12px;padding:7px 11px">取消</button><button id="confirmDelete" class="danger">确认删除课程</button></div></div></section></div></div>
  <div class="manage-bottom">ⓘ 信息、名单与课程概要集中在此页维护，无需切换步骤。</div>`;
  ['name','semester','note'].forEach(id=>$(id).oninput=()=>{draft[{name:'name',semester:'term',note:'note'}[id]]=$(id).value});
  $('saveManage').onclick=()=>busy(async()=>{draft.name=draft.name.trim();draft.term=draft.term.trim();if(!draft.name||!draft.term)throw new Error('课程名称和学期不能为空');const c=await api('/api/courses/'+encodeURIComponent(draft.id),{name:draft.name,term:draft.term,note:draft.note},'PUT');Object.assign(selected,c);await loadCourses();renderManage();toast('课程信息已保存')});
  const switchMethod=value=>{if($('roster')&&$('roster').value.trim()){toast('请先预览并加入名单。');return}method=value;renderManage()};
  $('uploadTab').onclick=()=>switchMethod('upload');$('pasteTab').onclick=()=>switchMethod('paste');
  bindUpload();
  if($('preview'))$('preview').onclick=preview;
  document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeStudent(Number(b.dataset.remove)));
  $('deleteCourse').onclick=()=>$('deleteConfirm').classList.remove('hidden');$('cancelDelete').onclick=()=>$('deleteConfirm').classList.add('hidden');
  $('confirmDelete').onclick=()=>busy(async()=>{await api('/api/courses/'+encodeURIComponent(selected.id),{confirm:true},'DELETE');await loadCourses();locked=false;location.hash='list';toast('课程已删除，原始数据已保留')});
}

async function route(){if(locked){if(location.hash!==lastHash)location.hash=lastHash;return}lastHash=location.hash;document.querySelector('.sh-main').scrollTop=0;const version=++routeVersion,hash=location.hash.slice(1)||'list';document.body.classList.toggle('managing',hash.startsWith('edit/'));$('view').innerHTML='<div class="empty">正在载入课程…</div>';try{await loadCourses();if(version!==routeVersion)return;if(hash==='new')await begin(null,version);else if(hash.startsWith('edit/'))await begin(decodeURIComponent(hash.slice(5)),version);else renderList()}catch(e){if(version!==routeVersion)return;$('view').innerHTML='<section class="panel"><h2>暂时无法打开课程</h2><p class="desc">'+esc(e.message)+'</p><button id="retry" style="margin-top:15px">重试</button> <a href="/courses" class="link">返回课程列表</a></section>';$('retry').onclick=route}}
window.addEventListener('hashchange',route);route();
</script></body></html>
