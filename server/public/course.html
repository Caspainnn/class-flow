<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>课程工作区 · 一堂课</title><link rel="stylesheet" href="/shell.css">
<style>
:root{--cg-line:#e3e7ed;--cg-radius:12px}
.cg-loading{padding:44px 0;color:var(--ink2);font-size:13px}
.cg-crumb{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink3);margin-bottom:12px}
.cg-crumb a{color:var(--ink2);text-decoration:none}
.cg-crumb a:hover{color:var(--blue);text-decoration:underline}
.cg-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px;padding:24px;border:1px solid #d9e5f4;border-radius:16px;background:linear-gradient(110deg,#fff 35%,#eaf3ff);box-shadow:0 6px 20px #254d7510}
.cg-head-main{flex:1;min-width:0}
.cg-head h1{margin:0;font-size:26px;font-weight:700;line-height:1.3;letter-spacing:-.5px;overflow-wrap:anywhere}
.cg-sub{margin:6px 0 0;font-size:13px;line-height:1.7;color:var(--ink2)}
.cg-head-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cg-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:8px 15px;border:1px solid var(--cg-line);border-radius:9px;background:#fff;color:var(--ink);font:inherit;font-size:13px;line-height:1.4;text-decoration:none;cursor:pointer;white-space:nowrap}
.cg-btn:hover{background:#f5f7fa;border-color:#cfd8e3}
.cg-btn:disabled{opacity:.5;cursor:default}
.cg-btn.cg-primary{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.cg-btn.cg-primary:hover{background:#2c323b;border-color:#2c323b}
.cg-btn.cg-primary:disabled:hover{background:var(--ink);border-color:var(--ink)}
/* 分段式标签：浅底容器 + 白色选中药丸，去掉文字下划线。 */
.cg-tabs{display:flex;gap:4px;margin:0 0 18px;padding:4px;border:1px solid var(--cg-line);border-radius:11px;background:#f2f5f9;overflow-x:auto;scrollbar-width:none}
.cg-tabs::-webkit-scrollbar{display:none}
.cg-tab{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:34px;padding:7px 16px;border:1px solid transparent;border-radius:8px;font-size:13px;line-height:1.3;color:#5b6472;text-decoration:none;white-space:nowrap;transition:background-color .15s,color .15s,border-color .15s,box-shadow .15s}
.cg-tab:hover{background:#e7edf4;color:var(--ink)}
.cg-tab.on,.cg-tab.on:hover{background:#e0edfd;border-color:#c6dcf7;color:#164f86;font-weight:650}
.cg-tab:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.cg-tab[aria-disabled=true]{color:#a8b0ba;cursor:default}
.cg-soon{padding:0 4px;border:1px dashed var(--cg-line);border-radius:4px;font-size:10px;color:var(--ink3)}
.cg-alert{margin:0 0 16px;padding:11px 13px;border:1px solid #f1b5b0;border-radius:9px;background:#fff1f0;color:#b42318;font-size:13px;line-height:1.7;overflow-wrap:anywhere}
.cg-alert[hidden]{display:none}
.cg-card{min-width:0;margin-bottom:16px;padding:22px;border:1px solid var(--cg-line);border-radius:var(--cg-radius);background:#fff}
.cg-card-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cg-card h2{margin:0;font-size:18px;font-weight:700;line-height:1.4}
.cg-meta{font-size:12px;color:var(--ink3)}
.cg-prose p{margin:0 0 10px;font-size:14px;line-height:1.9;color:#2b3038;white-space:pre-wrap;overflow-wrap:anywhere}
.cg-prose p:last-child{margin-bottom:0}
.cg-placeholder{margin:0;padding:15px;border:1px dashed var(--cg-line);border-radius:9px;background:#fafbfd;font-size:13px;line-height:1.8;color:var(--ink3)}
.cg-label{display:block;margin-bottom:7px;font-size:13px;font-weight:500;color:#525964}
.cg-textarea{width:100%;min-height:122px;padding:10px 12px;border:1px solid var(--cg-line);border-radius:9px;background:#fff;color:var(--ink);font:inherit;font-size:13.5px;line-height:1.85;resize:vertical}
.cg-textarea:focus-visible{outline:2px solid var(--blue);outline-offset:1px;border-color:#9fc0e2}
.cg-field-meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:7px;font-size:12px;line-height:1.7;color:var(--ink3)}
#courseInfoForm{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px 16px}
#courseInfoForm label{display:grid;gap:6px;font-size:13px}
#courseInfoForm input,#courseInfoForm textarea{width:100%;min-width:0;padding:9px 12px;border:1px solid var(--cg-line);border-radius:8px;font:inherit}
#courseInfoForm label:last-of-type,#courseInfoForm .cg-alert{grid-column:1/-1}
#courseInfoForm textarea{min-height:54px;resize:vertical}
#courseInfoForm button{grid-column:1/-1;justify-self:end}
.cg-intro .cg-prose{max-width:76ch;padding-left:14px;border-left:3px solid #bfd6f6}
.cg-map-card{background:#f8fafc}
@media(max-width:560px){#courseInfoForm{grid-template-columns:1fr}}
.cg-map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.cg-col{--accent:#245893;--tint:#eaf3ff;display:flex;flex-direction:column;min-width:0;padding:10px;border:1px solid var(--cg-line);border-radius:13px;background:#fff}
.cg-col[data-cat="literacy"]{--accent:#216453;--tint:#e8f6ef}
.cg-col[data-cat="knowledge"]{--accent:#64468d;--tint:#f2ecfa}
.cg-col[data-cat="ideology"]{--accent:#835019;--tint:#fcf1e0}
.cg-col-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;padding:11px 12px;border-radius:8px;background:var(--tint);color:var(--accent)}
.cg-col-head h3{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px;margin:0;font-size:15px;font-weight:700}
.cg-col-hint{font-size:11px;font-weight:400;color:var(--ink3)}
.cg-count{padding:2px 7px;border-radius:999px;background:#ffffffbf;color:var(--accent);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cg-list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.cg-list li{display:flex;flex-direction:column;gap:3px;min-width:0;padding:9px 11px;border-radius:8px;background:#f6f8fb}
.cg-name{font-size:13px;font-weight:650;line-height:1.6;color:#23272d;overflow-wrap:anywhere}
.cg-note{font-size:12px;line-height:1.7;color:#536071;overflow-wrap:anywhere}
.cg-col-empty{margin:0;padding:4px 0;font-size:12px;line-height:1.8;color:#b0b8c2}
.cg-rows{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.cg-row{display:flex;flex-direction:column;gap:6px;min-width:0;padding:8px;border:1px solid transparent;border-radius:8px;background:#fff}
.cg-row.invalid{border-color:#f0b4ae;background:#fff8f7}
.cg-row-line{display:flex;align-items:center;gap:6px;min-width:0}
.cg-input{width:100%;min-width:0;padding:7px 9px;border:1px solid var(--cg-line);border-radius:7px;background:#fff;color:var(--ink);font:inherit;font-size:12.5px;line-height:1.5}
.cg-input-note{font-size:12px;color:#4a5462}
.cg-input:focus-visible{outline:2px solid var(--blue);outline-offset:1px;border-color:#9fc0e2}
.cg-del{flex:none;width:28px;height:28px;padding:0;border:1px solid transparent;border-radius:7px;background:transparent;color:#9aa4b0;font:inherit;font-size:12px;line-height:1;cursor:pointer}
.cg-del:hover{background:#fdecea;border-color:#f2c6c0;color:#b42318}
.cg-del:disabled{opacity:.4;cursor:default}
.cg-add{margin-top:auto;padding:7px;border:1px dashed #cfd9e6;border-radius:8px;background:#fff;color:#526b84;font:inherit;font-size:12px;cursor:pointer}
.cg-add:hover{background:#f2f7fd;border-color:#9db9d6;color:var(--blue)}
.cg-add:disabled{opacity:.5;cursor:default}
.cg-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.cg-edit-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid #edf0f4}
.cg-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:1300;padding:10px 18px;border-radius:999px;background:#23282f;color:#fff;font-size:13px;box-shadow:0 8px 28px #16202b33;max-width:calc(100vw - 40px)}
.cg-toast[hidden]{display:none}
#cgDialog button{min-height:36px;padding:7px 14px;border:1px solid var(--cg-line);border-radius:8px;background:#fff;color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
#cgDialog button:hover{background:#f5f7fa}
#cgDialog .btn.danger{color:#b42318;border-color:#d92d20;background:#fff}
#cgDialog .btn.danger:hover{background:#fff1f0;color:#912018}
/* ---------- 教学任务台 ---------- */
.tb-hint{margin:5px 0 0;font-size:12px;line-height:1.7;color:var(--ink3)}
.tb-sm{min-height:32px;padding:5px 11px;font-size:12px}
.tb-week{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding:14px 16px;border:1px solid #dce8f7;border-radius:12px;background:#eff5fd}
.tb-week-label{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.tb-week-label small{font-size:12px;font-weight:400;color:#536681}
.tb-week-tag{padding:2px 8px;border-radius:999px;background:#d9e9fc;color:#245893;font-size:11px;font-weight:600}
.tb-week-nav{display:flex;gap:6px;margin-left:auto}
.tb-table-wrap{overflow-x:auto;border:1px solid var(--cg-line);border-radius:12px}
.tb-table{width:100%;border-collapse:collapse;font-size:13px}
.tb-table th{padding:9px 12px;border-bottom:1px solid var(--cg-line);background:#f6f8fb;font-size:12px;font-weight:600;color:#52647b;text-align:left;white-space:nowrap}
.tb-table td{padding:12px;border-bottom:1px solid #e9eef5;vertical-align:middle;line-height:1.6}
.tb-table tbody tr:hover{background:#f8fbff}
.tb-table tbody tr.tb-is-today{background:#f0f6ff}
.tb-table tbody tr:last-child td{border-bottom:0}
.tb-day{width:1%;white-space:nowrap;font-variant-numeric:tabular-nums;color:#245893;font-weight:650}
.tb-day small{display:block;font-size:11px;font-weight:400;color:#536681}
.tb-title{font-weight:650;color:#23272d;overflow-wrap:anywhere}
.tb-note{margin:0;color:#536071;overflow-wrap:anywhere}
.tb-note-inline{display:none}
.tb-actions{text-align:right;white-space:nowrap}
.tb-link{padding:2px 4px;border:0;background:transparent;color:#526b84;font:inherit;font-size:12px;line-height:1.6;cursor:pointer;white-space:nowrap}
.tb-link:hover{color:var(--blue);text-decoration:underline}
.tb-link.danger{color:#b42318}
.tb-link:disabled{opacity:.45;cursor:default;text-decoration:none}
.tb-empty{margin:0;padding:20px 16px;border:1px dashed #dbe5f1;border-radius:12px;background:#fafcff;font-size:13px;line-height:1.8;color:#536681}
.tb-editor{margin-bottom:14px;padding:14px;border:1px solid #dbe4ef;border-radius:10px;background:#fafcff}
.tb-grid{display:grid;grid-template-columns:180px minmax(0,1fr);gap:10px 12px}
.tb-grid .tb-wide{grid-column:1/-1}
.tb-label{display:block;margin-bottom:5px;font-size:12px;color:#525964}
.tb-input,.tb-textarea{width:100%;padding:8px 10px;border:1px solid var(--cg-line);border-radius:8px;background:#fff;color:var(--ink);font:inherit;font-size:13px;line-height:1.6}
.tb-textarea{min-height:60px;resize:vertical}
.tb-input:focus-visible,.tb-textarea:focus-visible{outline:2px solid var(--blue);outline-offset:1px;border-color:#9fc0e2}
.tb-input:disabled,.tb-textarea:disabled{background:#f5f7fa;color:#8b95a1}
.tb-editor-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.tb-editor-foot .tb-week-nav{margin-left:0}
.tb-inline-error{margin:0;font-size:12px;line-height:1.7;color:#b42318;overflow-wrap:anywhere}
.tb-inline-error:empty{display:none}
.tb-todo-add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tb-todo-add .tb-input{flex:1;min-width:190px}
.tb-todos{margin:0;padding:0;list-style:none}
.tb-todo{display:flex;align-items:flex-start;gap:10px;padding:10px 2px;border-bottom:1px solid #eef1f5}
.tb-todo:last-child{border-bottom:0}
.tb-check{flex:none;width:20px;height:20px;margin-top:2px;padding:0;border:1px solid #c7d2df;border-radius:6px;background:#fff;color:transparent;font:inherit;font-size:12px;line-height:1;cursor:pointer}
.tb-check:hover{border-color:#8fa6bf}
.tb-check[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.tb-check:disabled{opacity:.5;cursor:default}
.tb-todo-text{flex:1;min-width:0;font-size:13.5px;line-height:1.7;color:#23272d;overflow-wrap:anywhere}
.tb-todo.done .tb-todo-text{color:#98a2ae;text-decoration:line-through}
.tb-todo-edit{display:flex;flex:1;gap:8px;flex-wrap:wrap;min-width:0;align-items:center}
.tb-todo-edit .tb-input{flex:1;min-width:160px}
.tb-todo-edit .tb-actions{flex:none}
/* ---------- ima 知识库 ---------- */
.ima-native-frame{display:block;width:100%;height:clamp(520px,74vh,980px);margin-top:14px;border:1px solid var(--cg-line);border-radius:12px;background:#fff}
@media(max-width:1180px){.cg-map{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){
.cg-card{padding:16px}.cg-head h1{font-size:23px}.cg-map{grid-template-columns:minmax(0,1fr)}
.cg-head-actions{width:100%}.cg-head-actions .cg-btn{flex:1}
.cg-tabs{gap:3px;padding:3px}
.cg-tab{flex:1 1 0;min-width:0;min-height:33px;padding:7px 8px;font-size:12.5px;gap:5px}
.tb-grid{grid-template-columns:minmax(0,1fr)}
.tb-week-nav{width:100%;margin-left:0}
.tb-week-nav .cg-btn{flex:1}
.tb-table th:nth-child(3),.tb-table td:nth-child(3){display:none}
.tb-note-inline{display:block;margin-top:2px;font-size:12px;line-height:1.65}
.tb-todo-add .cg-btn{flex:1}
}
</style>

<body class="shelled" data-active="course">
<div class="app"><aside class="sh-side" id="shSide"></aside><main class="sh-main"><div class="wrap">
<div id="cgRoot" aria-live="polite"><div class="cg-loading">正在载入课程工作区…</div></div>
</div></main></div>
<dialog id="cgDialog" class="feedback-dialog" aria-labelledby="cgDialogTitle"></dialog>
<div id="cgToast" class="cg-toast" role="status" hidden></div>
<script src="/shell.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=value=>String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS=[
  {key:'skill',label:'技能',hint:'能做什么'},
  {key:'literacy',label:'素养',hint:'形成什么'},
  {key:'knowledge',label:'知识',hint:'掌握什么'},
  {key:'ideology',label:'思政',hint:'内化什么'}
];
const LIMITS={intro:2000,name:60,note:160,items:40,boardTitle:80,boardNote:300,todo:120};
const ROOT=()=>$('cgRoot');
let course=null,guide=null,draft=null,editing=false,busy=false,alertText='',invalid=null,loadError='',seq=0,toastTimer=null;
let tab='guide',board=null,boardLoading=false,boardError='',boardBusy=false,boardAlert='';
let weekStartKey='',scheduleEdit=null,todoEdit=null,scheduleError='',todoError='',todoDraft='';

function courseId(){const match=location.pathname.match(/^\/course\/([\w-]+)\/?$/);return match?decodeURIComponent(match[1]):''}
function api(url,method='GET',body){
  return fetch(url,method==='GET'?{}:{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(async res=>{const data=await res.json().catch(()=>({error:''}));if(!res.ok){const error=new Error(data.error||('请求失败（'+res.status+'），请稍后重试。'));error.field=data.field||'';error.status=res.status;throw error}return data;});
}
function toast(message){const el=$('cgToast');if(!el)return;el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true},3200)}
function fmt(ts){const d=new Date(Number(ts)||0);if(!Number.isFinite(d.getTime())||!ts)return '';const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}

/* ---------- 日期与周 ---------- */
const pad2=n=>String(n).padStart(2,'0');
const WEEKDAYS=['周日','周一','周二','周三','周四','周五','周六'];
function keyOf(date){return `${date.getFullYear()}-${pad2(date.getMonth()+1)}-${pad2(date.getDate())}`}
function todayKey(){return keyOf(new Date())}
function parseDay(value){const match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value||''));if(!match)return null;const date=new Date(Number(match[1]),Number(match[2])-1,Number(match[3]));if(Number.isNaN(date.getTime())||keyOf(date)!==match[0])return null;return date}
function shiftDay(value,days){const date=parseDay(value);if(!date)return '';date.setDate(date.getDate()+days);return keyOf(date)}
function weekStartOf(value){const date=parseDay(value);if(!date)return '';date.setDate(date.getDate()-((date.getDay()+6)%7));return keyOf(date)}
function weekDays(start){return Array.from({length:7},(_,index)=>shiftDay(start,index))}
function dayLabel(value){const date=parseDay(value);return date?`${date.getMonth()+1}月${date.getDate()}日`:value}
function weekRangeLabel(start){const end=shiftDay(start,6);const a=parseDay(start),b=parseDay(end);if(!a||!b)return '本周';const sameYear=a.getFullYear()===b.getFullYear();return `${a.getFullYear()}年${a.getMonth()+1}月${a.getDate()}日 – ${sameYear?`${b.getMonth()+1}月${b.getDate()}日`:`${b.getFullYear()}年${b.getMonth()+1}月${b.getDate()}日`}`}
const courseTabs={guide:'课程导学',roster:'课程名单',tasks:'教学任务台',ima:'ima 知识库'};
function tabFromHash(){const key=(location.hash||'').slice(1);return Object.hasOwn(courseTabs,key)?key:'guide'}
function pageTitle(){return course.name+' · '+courseTabs[tab]+' · 一堂课'}
function focusField(id){const el=$(id);if(!el)return;if(el.focus)el.focus();if(el.scrollIntoView)el.scrollIntoView({block:'center'})}

function emptyMap(){return Object.fromEntries(CATS.map(cat=>[cat.key,[]]))}
function cloneGuide(source){return {intro:String(source&&source.intro||''),map:Object.fromEntries(CATS.map(cat=>[cat.key,((source&&source.map&&source.map[cat.key])||[]).map(entry=>({id:entry.id,name:String(entry.name||''),note:String(entry.note||'')}))]))}}
function serialize(value){
  const clean=cloneGuide(value);
  clean.intro=clean.intro.trim();
  clean.map=Object.fromEntries(CATS.map(cat=>[cat.key,clean.map[cat.key].map(entry=>({name:entry.name.trim(),note:entry.note.trim()})).filter(entry=>entry.name||entry.note)]));
  return JSON.stringify(clean);
}
function isDirty(){return Boolean(editing&&draft&&serialize(draft)!==serialize(guide))}
function statusLine(){
  const parts=[(Number(course.count)||0)+' 名学生'];
  if(Number(course.sessions))parts.push(Number(course.sessions)+' 次签到');
  if(Number(course.assignments))parts.push(Number(course.assignments)+' 份作业');
  parts.push(course.ready?'名单已就绪':'待录入名单');
  return parts.join(' · ');
}

/* ---------- 编辑中的增删与校验 ---------- */
function entryOf(cat,id){const list=draft&&draft.map[cat];return list?list.find(entry=>entry.id===id):null}
function nextId(){let id;do{id='n'+(++seq)}while(CATS.some(cat=>(draft.map[cat.key]||[]).some(entry=>entry.id===id)));return id}
function addEntry(catKey){
  if(!editing||busy)return;
  const cat=CATS.find(item=>item.key===catKey);if(!cat)return;
  const list=draft.map[cat.key];
  if(list.length>=LIMITS.items){alertText=`「${cat.label}」最多 ${LIMITS.items} 条，请先合并或删减。`;render();return}
  const entry={id:nextId(),name:'',note:''};list.push(entry);invalid=null;render();focusInput(cat.key,entry.id,'name');
}
function removeEntry(catKey,id){
  if(!editing||busy)return;
  const list=draft.map[catKey];if(!list)return;
  draft.map[catKey]=list.filter(entry=>entry.id!==id);
  if(invalid&&invalid.cat===catKey&&invalid.id===id)invalid=null;
  render();
}
function problems(){
  const intro=draft.intro.trim();
  if(intro.length>LIMITS.intro)return {message:`课程简介最多 ${LIMITS.intro} 字，当前 ${intro.length} 字。`,focus:{kind:'intro'}};
  for(const cat of CATS){
    const seen=new Map();
    const list=draft.map[cat.key];
    for(let i=0;i<list.length;i++){
      const entry=list[i],name=entry.name.trim(),note=entry.note.trim();
      if(!name){
        if(!note)continue;                                     // 整条空行保存时忽略
        return {message:`「${cat.label}」第 ${i+1} 条只有说明，还没有填写名称。`,focus:{kind:'entry',cat:cat.key,id:entry.id,field:'name'}};
      }
      if(name.length>LIMITS.name)return {message:`「${cat.label}」第 ${i+1} 条名称最多 ${LIMITS.name} 字，当前 ${name.length} 字。`,focus:{kind:'entry',cat:cat.key,id:entry.id,field:'name'}};
      if(note.length>LIMITS.note)return {message:`「${cat.label}」第 ${i+1} 条说明最多 ${LIMITS.note} 字，当前 ${note.length} 字。`,focus:{kind:'entry',cat:cat.key,id:entry.id,field:'note'}};
      if(seen.has(name))return {message:`「${cat.label}」里「${name}」重复了，请合并或改名。`,focus:{kind:'entry',cat:cat.key,id:seen.get(name),field:'name'}};
      seen.set(name,entry.id);
    }
  }
  return null;
}
function payload(){
  const clean=cloneGuide(draft);
  clean.intro=clean.intro.trim();
  clean.map=Object.fromEntries(CATS.map(cat=>[cat.key,clean.map[cat.key]
    .map(entry=>({id:entry.id,name:entry.name.trim(),note:entry.note.trim()}))
    .filter(entry=>entry.name)]));
  return clean;
}
function focusTarget(target){
  if(!target)return;
  if(target.kind==='intro'){const el=$('cgIntro');if(el&&el.focus){el.focus();el.scrollIntoView&&el.scrollIntoView({block:'center'})}return}
  focusInput(target.cat,target.id,target.field);
}
function focusInput(cat,id,field){
  const el=$(inputId(cat,id,field));if(!el)return;
  if(el.focus)el.focus();
  if(el.scrollIntoView)el.scrollIntoView({block:'center'});
}
function inputId(cat,id,field){return 'cg-'+cat+'-'+id+'-'+field}
function inputElement(cat,id,field){return $(inputId(cat,id,field))}

/* ---------- 弹窗 ---------- */
function openDialog(options){
  const dialog=$('cgDialog');
  dialog.innerHTML=`<h2 id="cgDialogTitle">${esc(options.title)}</h2><p>${esc(options.body)}</p><div class="feedback-actions"><button type="button" id="cgDialogCancel">${esc(options.cancel||'继续编辑')}</button><button type="button" id="cgDialogConfirm" class="${options.danger===false?'':'btn danger'}">${esc(options.confirm||'确认')}</button></div>`;
  if(dialog.showModal)dialog.showModal();
  const close=()=>{if(dialog.close)dialog.close();dialog.innerHTML=''};
  const cancel=()=>close();
  $('cgDialogCancel').onclick=cancel;
  $('cgDialogConfirm').onclick=()=>{close();if(options.onConfirm)options.onConfirm()};
  dialog.oncancel=()=>{dialog.innerHTML=''};
  const safe=$('cgDialogCancel');safe.focus&&safe.focus();
}

function startEdit(){

  draft=cloneGuide(guide);editing=true;invalid=null;alertText='';render();

}
function cancelEdit(){
  if(busy||!editing)return;
  if(!isDirty()){editing=false;draft=null;invalid=null;alertText='';render();return}
  openDialog({title:'放弃未保存的导学修改？',body:'课程简介和能力图谱的改动还没有保存，放弃后需要重新填写。',cancel:'继续编辑',confirm:'放弃修改',onConfirm:()=>{editing=false;draft=null;invalid=null;alertText='';render()}});
}
async function save(){
  if(busy||!editing)return;
  const problem=problems();
  if(problem){invalid=problem.focus&&problem.focus.kind==='entry'?problem.focus:null;alertText=problem.message;render();focusTarget(problem.focus);return}
  busy=true;alertText='';invalid=null;render();
  try{
    const data=await api('/api/courses/'+encodeURIComponent(course.id)+'/guide','PUT',payload());
    guide={intro:data.intro||'',map:data.map||emptyMap(),updatedAt:data.updatedAt||0};
    editing=false;draft=null;render();toast('课程导学已保存');
  }catch(error){
    alertText=error.message||'保存失败，请稍后重试。';

    if(editing)render();
  }
}
window.appCanNavigate=nextUrl=>{
  if(busy||boardBusy){toast('正在保存，请稍候再切换页面');return false}

  openDialog({title:'离开导学编辑？',body:'当前修改还没有保存，离开后会丢失。',cancel:'继续编辑',confirm:'放弃修改并离开',onConfirm:()=>{editing=false;draft=null;location.href=nextUrl||'/courses'}});
  return false;
};

async function saveBoard(payload,options={}){
  if(boardBusy)return false;

      schedule:(data.schedule||[]).map(item=>({id:item.id,date:item.date,title:item.title,note:item.note||''})),
      todos:(data.todos||[]).map(item=>({id:item.id,text:item.text,done:Boolean(item.done)})),
      updatedAt:data.updatedAt||0

function openScheduleAdd(){
  if(!board||boardBusy)return;
  const start=weekStartKey||weekStartOf(todayKey());
  const today=todayKey();
  const date=today>=start&&today<=shiftDay(start,6)?today:start;
  scheduleEdit={id:null,date,title:'',note:''};scheduleError='';render();focusField('tbTitle');

function openScheduleEdit(id){
  if(!board||boardBusy)return;
  const item=board.schedule.find(entry=>entry.id===id);if(!item)return;
  scheduleEdit={id:item.id,date:item.date,title:item.title,note:item.note};scheduleError='';render();focusField('tbTitle');
}
async function saveSchedule(){
  if(!scheduleEdit||boardBusy)return;
  const value={date:String(scheduleEdit.date||'').trim(),title:String(scheduleEdit.title||'').trim(),note:String(scheduleEdit.note||'').trim()};
  if(!parseDay(value.date)){scheduleError='请选择日程日期。';render();focusField('tbDate');return}
  if(!value.title){scheduleError='请填写日程标题。';render();focusField('tbTitle');return}
  if(value.title.length>LIMITS.boardTitle){scheduleError=`日程标题最多 ${LIMITS.boardTitle} 字，当前 ${value.title.length} 字。`;render();focusField('tbTitle');return}
  if(value.note.length>LIMITS.boardNote){scheduleError=`日程备注最多 ${LIMITS.boardNote} 字，当前 ${value.note.length} 字。`;render();focusField('tbNote');return}
  const id=scheduleEdit.id;
  const schedule=[...board.schedule.filter(item=>item.id!==id),id?{id,...value}:value];
  scheduleError='';
  const ok=await saveBoard({schedule,todos:board.todos},{inline:'schedule',toast:id?'日程已更新':'日程已添加'});
  if(ok){scheduleEdit=null;weekStartKey=weekStartOf(value.date);render()}
}
function confirmRemoveSchedule(id){
  if(!board||boardBusy)return;
  const item=board.schedule.find(entry=>entry.id===id);if(!item)return;
  openDialog({title:'删除这条日程？',body:`${dayLabel(item.date)}「${item.title}」会从教学日程中删除，删除后无法恢复。`,cancel:'保留日程',confirm:'删除日程',onConfirm:()=>removeSchedule(id)});
}
async function removeSchedule(id){
  if(!board||boardBusy)return;
  const ok=await saveBoard({schedule:board.schedule.filter(item=>item.id!==id),todos:board.todos},{toast:'日程已删除'});
  if(ok&&scheduleEdit&&scheduleEdit.id===id){scheduleEdit=null;render()}
}

/* ---- 待办动作 ---- */
async function addTodo(){
  if(!board||boardBusy)return;
  const value=String(todoDraft||'').trim();
  if(!value){todoError='请填写待办内容。';render();focusField('tbTodoInput');return}
  if(value.length>LIMITS.todo){todoError=`待办最多 ${LIMITS.todo} 字，当前 ${value.length} 字。`;render();focusField('tbTodoInput');return}
  todoError='';
  const ok=await saveBoard({schedule:board.schedule,todos:[...board.todos,{text:value,done:false}]},{inline:'todo',toast:'待办已添加'});
  if(ok){todoDraft='';render()}
}
async function toggleTodo(id){
  if(!board||boardBusy)return;
  const item=board.todos.find(entry=>entry.id===id);if(!item)return;
  await saveBoard({schedule:board.schedule,todos:board.todos.map(entry=>entry.id===id?{...entry,done:!entry.done}:entry)},{toast:item.done?'已恢复为待办':'已标记完成'});
}
function openTodoEdit(id){
  if(!board||boardBusy)return;
  const item=board.todos.find(entry=>entry.id===id);if(!item)return;
  todoEdit={id:item.id,text:item.text};todoError='';render();focusField('tbTodoEdit');
}
async function saveTodo(){
  if(!todoEdit||boardBusy)return;
  const value=String(todoEdit.text||'').trim();
  if(!value){todoError='待办内容不能为空。';render();focusField('tbTodoEdit');return}
  if(value.length>LIMITS.todo){todoError=`待办最多 ${LIMITS.todo} 字，当前 ${value.length} 字。`;render();focusField('tbTodoEdit');return}
  todoError='';
  const id=todoEdit.id;
  const ok=await saveBoard({schedule:board.schedule,todos:board.todos.map(entry=>entry.id===id?{...entry,text:value}:entry)},{inline:'todo',toast:'待办已更新'});
  if(ok){todoEdit=null;render()}
}
function confirmRemoveTodo(id){
  if(!board||boardBusy)return;
  const item=board.todos.find(entry=>entry.id===id);if(!item)return;
  openDialog({title:'删除这条待办？',body:`「${item.text}」会从课程待办中删除，删除后无法恢复。`,cancel:'保留待办',confirm:'删除待办',onConfirm:()=>removeTodo(id)});
}
async function removeTodo(id){
  if(!board||boardBusy)return;
  const ok=await saveBoard({schedule:board.schedule,todos:board.todos.filter(item=>item.id!==id)},{toast:'待办已删除'});
  if(ok&&todoEdit&&todoEdit.id===id){todoEdit=null;render()}
}

/* ---------- ima 知识库（只读状态；绑定与更换统一在 /ima 设置页完成） ---------- */
function imaView(){
  return `<section class="cg-card" aria-labelledby="imaTitle">
    <div class="cg-card-head"><h2 id="imaTitle">ima 知识库</h2></div>
    <iframe class="ima-native-frame" title="ima 原生问答" src="https://ima.qq.com/" referrerpolicy="no-referrer"></iframe>
  </section>`;
}

function render(){
  if(!course)return;
  if(tab==='tasks'&&!weekStartKey)weekStartKey=weekStartOf(todayKey());
  ROOT().innerHTML=head()+(tab==='tasks'?tasksView():tab==='ima'?imaView():tab==='roster'
    ?`<iframe title="课程名单" src="/courses?view=roster#edit/${encodeURIComponent(course.id)}" style="display:block;width:100%;height:70vh;border:0"></iframe>`
    :courseInfoCard()+introCard()+mapCard());

}

function courseInfoCard(){
  return `<section class="cg-card"><div class="cg-card-head"><h2>课程信息</h2></div>
  <form id="courseInfoForm">
    <label class="cg-field">课程名称 <input name="name" required maxlength="80" value="${esc(course.name)}"></label>
    <label class="cg-field">学期 <input name="term" required maxlength="40" value="${esc(course.term||'')}"></label>
    <label class="cg-field">备注 <textarea name="note" maxlength="300">${esc(course.note||'')}</textarea></label>
    <p class="cg-alert" role="alert" hidden></p>
    <button class="cg-btn" type="submit">保存课程信息</button>
  </form></section>`;
}

ROOT().addEventListener('submit',async event=>{
  const form=event.target;
  if(form.id!=='courseInfoForm')return;
  event.preventDefault();
  const button=form.querySelector('button');
  if(button.disabled)return;
  const error=form.querySelector('[role="alert"]');
  const fields=Object.fromEntries(new FormData(form));
  button.disabled=true;
  error.hidden=true;
  try{
    const saved=await api('/api/courses/'+encodeURIComponent(course.id),'PUT',fields);
    for(const key of ['name','term','note'])course[key]=saved[key];
    document.title=pageTitle();
    const title=ROOT().querySelector('h1');
    if(title)title.textContent=course.name;
    const subtitle=ROOT().querySelector('.cg-sub');
    if(subtitle)subtitle.textContent=(course.term||'未填写学期')+' · '+statusLine();
    toast('课程信息已保存');
  }catch(e){
    error.textContent=e.message;
    error.hidden=false;
  }finally{button.disabled=false}
});
function renderFailure(){
  ROOT().innerHTML=`<nav class="cg-crumb" aria-label="位置"><a href="/courses">课程管理</a><span aria-hidden="true">/</span><span>课程工作区</span></nav>
  <section class="cg-card"><h2>暂时打不开这门课程</h2><p class="cg-alert" role="alert">${esc(loadError||'加载失败，请重试。')}</p><div class="cg-head-actions"><button type="button" class="cg-btn cg-primary" data-action="retry">重新加载</button><a class="cg-btn" href="/courses">返回课程管理</a></div></section>`;
}

/* ---------- 事件 ---------- */
ROOT().addEventListener('click',event=>{
  const tabLink=event.target&&event.target.closest?event.target.closest('[data-tab]'):null;
  if(tabLink&&tabLink.dataset&&tabLink.dataset.tab){
    const next=tabLink.dataset.tab;
    if(!Object.hasOwn(courseTabs,next))return;
    if(next===tab){event.preventDefault();return}
    if(busy){event.preventDefault();toast('正在保存，请稍候再切换功能');return}
    if(tab==='guide'&&editing&&isDirty()){
      event.preventDefault();
      openDialog({title:'离开导学编辑？',body:'课程导学还有未保存的修改，切换功能后会丢失。',cancel:'继续编辑',confirm:'放弃修改并切换',onConfirm:()=>{editing=false;draft=null;invalid=null;alertText='';setTab(next)}});
      return;
    }
    return;   // 交给浏览器完成 hash 导航，由 hashchange 统一切换
  }
  const trigger=event.target&&event.target.closest?event.target.closest('[data-action]'):null;
  if(!trigger)return;
  const action=trigger.dataset.action;
  if(action==='edit')startEdit();
  else if(action==='save')save();
  else if(action==='cancel')cancelEdit();
  else if(action==='add')addEntry(trigger.dataset.cat);
  else if(action==='remove')removeEntry(trigger.dataset.cat,trigger.dataset.id);
  else if(action==='retry')load();
  else if(action==='week-prev'){weekStartKey=shiftDay(weekStartKey||weekStartOf(todayKey()),-7);render()}
  else if(action==='week-next'){weekStartKey=shiftDay(weekStartKey||weekStartOf(todayKey()),7);render()}
  else if(action==='week-now'){weekStartKey=weekStartOf(todayKey());render()}
  else if(action==='schedule-add')openScheduleAdd();
  else if(action==='schedule-edit')openScheduleEdit(trigger.dataset.id);
  else if(action==='schedule-cancel'){scheduleEdit=null;scheduleError='';render()}
  else if(action==='schedule-save')saveSchedule();
  else if(action==='schedule-remove')confirmRemoveSchedule(trigger.dataset.id);
  else if(action==='board-retry'){boardError='';board=null;loadBoard()}
  else if(action==='todo-add')addTodo();
  else if(action==='todo-toggle')toggleTodo(trigger.dataset.id);
  else if(action==='todo-edit')openTodoEdit(trigger.dataset.id);
  else if(action==='todo-cancel'){todoEdit=null;todoError='';render()}
  else if(action==='todo-save')saveTodo();
  else if(action==='todo-remove')confirmRemoveTodo(trigger.dataset.id);
});
ROOT().addEventListener('input',event=>{
  const target=event.target;
  if(!target)return;
  if(target.id==='tbDate'&&scheduleEdit){scheduleEdit.date=target.value;return}
  if(target.id==='tbTitle'&&scheduleEdit){scheduleEdit.title=target.value;return}
  if(target.id==='tbNote'&&scheduleEdit){scheduleEdit.note=target.value;return}
  if(target.id==='tbTodoInput'){todoDraft=target.value;return}
  if(target.id==='tbTodoEdit'&&todoEdit){todoEdit.text=target.value;return}
  if(!target.dataset||!editing||!draft)return;
  if(target.dataset.field==='intro'){
    draft.intro=target.value;
    const counter=$('cgIntroCount');
    if(counter)counter.textContent=draft.intro.length+' / '+LIMITS.intro;
    return;
  }
  const entry=entryOf(target.dataset.cat,target.dataset.id);
  if(!entry)return;
  if(target.dataset.field==='name'||target.dataset.field==='note')entry[target.dataset.field]=target.value;
  if(invalid&&invalid.cat===target.dataset.cat&&invalid.id===target.dataset.id){
    invalid=null;
    const row=target.closest?target.closest('.cg-row'):null;
    if(row&&row.classList)row.classList.remove('invalid');
  }
});
ROOT().addEventListener('keydown',event=>{
  if(event.key!=='Enter'||event.isComposing)return;
  const id=event.target&&event.target.id;
  if(id==='tbTitle'){event.preventDefault();saveSchedule()}
  else if(id==='tbTodoInput'){event.preventDefault();addTodo()}
  else if(id==='tbTodoEdit'){event.preventDefault();saveTodo()}
});
window.addEventListener('hashchange',()=>{
  const next=tabFromHash();
  if(next===tab)return;
  if(tab==='guide'&&editing&&isDirty()){
    try{if(window.history&&window.history.replaceState)window.history.replaceState(null,'','#guide')}catch{}
    openDialog({title:'离开导学编辑？',body:'课程导学还有未保存的修改，切换后会丢失。',cancel:'继续编辑',confirm:'放弃修改并切换',onConfirm:()=>{editing=false;draft=null;invalid=null;alertText='';setTab(next)}});
    return;
  }
  setTab(next);
});

async function load(){
  loadError='';editing=false;draft=null;invalid=null;alertText='';
  board=null;boardLoading=false;boardError='';boardBusy=false;boardAlert='';weekStartKey='';scheduleEdit=null;todoEdit=null;scheduleError='';todoError='';todoDraft='';
  ROOT().innerHTML='<div class="cg-loading">正在载入课程工作区…</div>';
  try{
    const id=courseId();
    if(!id)throw new Error('课程地址不完整，请从课程管理进入。');
    const [list,data]=await Promise.all([api('/api/courses'),api('/api/courses/'+encodeURIComponent(id)+'/guide')]);
    const found=(list.items||[]).find(item=>item.id===id);
    if(!found)throw new Error('课程不存在，可能已被删除。');
    course=found;
    guide={intro:data.intro||'',map:data.map||emptyMap(),updatedAt:data.updatedAt||0};
    tab=tabFromHash();
    document.title=pageTitle();
    render();
    if(tab==='tasks')loadBoard();
  }catch(error){
    loadError=error.message||'加载失败，请重试。';
    renderFailure();
  }
}
load();
</script>
