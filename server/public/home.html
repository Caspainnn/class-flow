<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作台 · 一堂课</title>
<link rel="stylesheet" href="/shell.css">
<style>
.head{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.head h1{font-size:18px;font-weight:500;margin:0}
.head .sub{font-size:12px;color:var(--ink2);margin-top:4px}
.head .r{margin-left:auto;display:flex;gap:8px;flex:none}
.btn{font-family:inherit;font-size:12.5px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);
  background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.btn:hover{border-color:#b9bec6}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:#2c2f33}
.btn.mini{padding:5px 10px;font-size:11.5px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:12px}
.card h2{font-size:13px;font-weight:500;margin:0 0 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 span{font-weight:400;color:var(--ink3);font-size:11.5px}
.card h2 .more{margin-left:auto;font-size:11.5px;color:var(--blue);cursor:pointer;font-weight:400;text-decoration:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 16px;text-decoration:none;color:inherit;display:block}
.stat b{display:block;font-size:24px;font-weight:500;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--ink3);display:block;margin-top:2px}
a.stat:hover{border-color:#c9ced6}
.todo{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.todo:last-child{border-bottom:none}
.todo .d{width:7px;height:7px;border-radius:50%;flex:none}
.todo .go{margin-left:auto;font-size:11.5px;color:var(--blue);text-decoration:none;white-space:nowrap}
.crow{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;border:1px solid transparent}
.crow:hover{background:#f8f9fb}
.crow .k{width:22px;height:22px;border-radius:6px;background:#f1f2f5;color:var(--ink3);font-size:11.5px;
  display:flex;align-items:center;justify-content:center;flex:none}
.crow .nm{font-size:13.5px;font-weight:500}
.crow .meta{font-size:11.5px;color:var(--ink3);margin-top:2px}
.crow .rt{margin-left:auto;font-size:11px;color:var(--ink3);display:flex;align-items:center;gap:10px}
.tag{font-size:10.5px;padding:2px 7px;border-radius:5px;background:#f1f2f5;color:var(--ink2);white-space:nowrap}
.tag.info{background:#edf3fa;color:var(--blue)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fn{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 15px;
  display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.fn:hover{border-color:#c9ced6;box-shadow:0 2px 8px rgba(23,25,28,.04)}
.fn .fi{width:26px;height:26px;border-radius:7px;background:#f4f6f8;display:flex;align-items:center;
  justify-content:center;font-size:12px;color:var(--ink2);flex:none}
.fn .ft{font-size:12.5px;font-weight:500}
.fn .fd{font-size:10.5px;color:var(--ink3);margin-top:1px}
.empty{font-size:12.5px;color:var(--ink3);padding:12px 0;line-height:1.9}
.two{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
@media (max-width:1180px){.stats{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}}

/* Workbench visual hierarchy; scoped to this page so other modules stay stable. */
body[data-active=home] .sh-main{padding:30px 32px 44px}
body[data-active=home] .head{align-items:center;gap:20px;margin-bottom:25px;padding:3px 0 5px}
body[data-active=home] .head h1{font-size:28px;font-weight:650;letter-spacing:-.7px;line-height:1.4}

body[data-active=home] .sh-main .stat{position:relative;border:1px solid #e1e7ef;border-radius:13px;background:#fff;padding:20px 22px 18px;box-shadow:0 3px 12px #203c5903;min-width:0}

body[data-active=home] .sh-main .home-columns{gap:20px;margin-bottom:24px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
body[data-active=home] .home-primary{display:flex;flex-direction:column;gap:18px}
body[data-active=home] .card{padding:22px 24px;border-radius:13px;border:1px solid #e1e7ef;box-shadow:0 3px 12px #203c5903;margin-bottom:20px;min-width:0}

<script src="/shell.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = ts => { const d = new Date(ts), p = n => String(n).padStart(2, '0'); return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const ago = ts => {
  if (!ts) return '还没上过';
  const diff = Date.now() - ts, day = 86400000;
  if (diff < day) { const h = Math.floor(diff / 3600000); return h < 1 ? '刚上过' : h + ' 小时前'; }
  const d = Math.floor(diff / day);
  return d === 1 ? '昨天' : (d < 30 ? d + ' 天前' : Math.floor(d / 30) + ' 个月前');
};
const today = () => { const d = new Date(); return `${d.getMonth() + 1}月${d.getDate()}日 周${'日一二三四五六'[d.getDay()]}`; };

async function api(u) { try { const r = await fetch(u, { cache: 'no-store' }); return await r.json(); } catch { return null; } }

(async function boot() {
  const all = await api('/api/all');
  if (!all) { $('#sub').textContent = '连不上本地服务，双击「课中签到.bat」重新启动'; return; }
  const ses = ((await api('/api/sessions')) || {}).sessions || [];
  const courses = all.courses || [], students = all.students || [];
  const activeCourseId = (all.settings && all.settings.activeCourseId) || (courses[0] || {}).id || '';

  let xq = null;
  if (activeCourseId) xq = await api('/api/xq/data?courseId=' + encodeURIComponent(activeCourseId));

  const cnt = id => students.filter(s => s.courseId === id).length;
  const lastOf = id => ses.filter(s => s.courseId === id).sort((a, b) => b.startedAt - a.startedAt)[0] || null;
  const weekSes = ses.filter(s => Date.now() - s.startedAt < 7 * 86400000).length;
  const warns = xq ? xq.overall.warns : 0;
  const hwTodo = xq ? (xq.homework || []).filter(h => h.sub < h.total) : [];
  const activeSes = all.active ? ses.find(s => s.id === all.active) : null;
  const curCourse = courses.find(c => c.id === activeCourseId);

  $('#sub').textContent = `${today()} · ${courses.length} 门课 · ${students.length} 名学生` +
    (activeSes ? ' · 有一场签到正在进行' : '');

  const icon = path => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${path}</svg>`;
  const statItems=[
    {value:courses.length,label:'课程总览',note:'管理课程与教学名单',path:'<path d="M3 6h7l2 2h9v12H3zM3 6V4h7l2 2"/>'},
    {value:students.length,label:'学生总数',note:'来自已录入的课程名单',path:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M21 20v-2a5 5 0 0 0-4-5"/>'},
    {value:weekSes,label:'近7天课次',note:'回顾近期课堂活动',path:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h3M8 17h7"/>'},
    {value:warns,label:'待关注学生',note:curCourse?'当前课程 · '+curCourse.name:'当前课程预警汇总',path:'<path d="M12 3 2 21h20zM12 9v5M12 17h.01"/>',href:'/xueqing?tab=warn',warning:warns>0}
  ];
  $('#stats').innerHTML=statItems.map(s=>`<${s.href?'a':'div'} class="stat" ${s.href?'href="'+s.href+'"':''}><i class="stat-icon">${icon(s.path)}</i><span class="stat-label">${s.label}</span><b ${s.warning?'style="color:var(--red)"':''}>${s.value}</b><span class="stat-note">${esc(s.note)}</span></${s.href?'a':'div'}>`).join('');
  $('#fnWarn').textContent = warns ? warns + ' 人待关注' : '按规则自动列出';

  const todos = [];
  if (activeSes) {
    const c = courses.find(x => x.id === activeSes.courseId);
    todos.push({ c: 'red', txt: `「${c ? c.name : ''}」有一次签到还没结束（${activeSes.present}/${activeSes.total}）`, go: '/session', label: '回到签到 →' });
  }
  hwTodo.slice(0, 2).forEach(h => {
    todos.push({ c: 'amber', txt: `「${h.name}」还有 ${h.total - h.sub} 人没录分`, go: '/homework?id=' + encodeURIComponent(h.id), label: '去维护 →' });
  });
  if (warns) {
    const names = (xq.students || []).filter(s => s.warns.length).slice(0, 2).map(s => s.name).join('、');
    todos.push({ c: 'blue', txt: `${warns} 名学生命中预警（${names}${warns > 2 ? ' 等' : ''}）`, go: '/xueqing?tab=warn', label: '看名单 →' });
  }
  $('#todos').innerHTML = todos.length ? todos.map(t =>
    `<div class="todo"><span class="d" style="background:var(--${t.c})"></span><span>${esc(t.txt)}</span>` +
    `<a class="go" href="${t.go}">${t.label}</a></div>`).join('')
    : '<div class="empty">暂无待处理事项，可以继续准备下一节课。</div>';

  $('#courseSub').textContent = courses.length ? `${courses.length} 门` : '';
  $('#courses').innerHTML = courses.length ? courses.map((c, i) => {
    const last = lastOf(c.id), on = all.active && last && last.id === all.active;
    return `<div class="crow">
      <span class="k">${i + 1}</span>
      <div><div class="nm">${esc(c.name)}</div><div class="meta">${cnt(c.id)} 人${c.term ? ' · ' + esc(c.term) : ''} · ${last ? '出勤 ' + last.rate + '%' : '还没点过名'}</div></div>
      <div class="rt">${on ? '<span class="tag info">进行中</span>' : ''}<span>${ago(last && last.startedAt)}</span>
        <a class="btn mini" href="/session?courseId=${c.id}">发起</a></div>
    </div>`;
  }).join('') : '<div class="empty">还没有课程。去 <a href="/courses" style="color:var(--blue)">课程管理</a> 建一门。</div>';

  const latest = ses.slice().sort((a, b) => b.startedAt - a.startedAt)[0];
  if (!latest) {
    $('#last').innerHTML = '<div class="empty">还没有点名记录。</div>';
  } else {
    const c = courses.find(x => x.id === latest.courseId);
    $('#lastCard').querySelector('h2').innerHTML =
      `最近一次点名 <span>${fmt(latest.startedAt)} · ${esc(c ? c.name : '')}</span>` +
      `<a class="more" href="/api/export.xlsx?sessionId=${latest.id}">导出这次 →</a>`;
    $('#last').innerHTML=`<div class="last-metrics"><div class="last-metric">到课人数<b>${latest.present}<small style="font-size:12px;color:#93a2af;font-weight:400"> / ${latest.total}</small></b></div><div class="last-metric">迟到人数<b style="color:var(--amber)">${latest.late}</b></div><div class="last-metric">缺勤人数<b style="color:${latest.absent?'var(--red)':'#2f4d67'}">${latest.absent}</b></div><div class="last-metric">答对率<b style="color:var(--ok)">${latest.correctRate==null?'—':latest.correctRate+'%'}</b></div></div>${latest.question?`<div class="last-question">课堂题目 · ${esc(latest.question)}</div>`:''}`;
    if (curCourse) $('#sub').textContent += ` · 学情取「${curCourse.name}」`;
  }
})();
</script>
</body>
</html>
