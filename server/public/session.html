<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>签到管理 · 一堂课</title>
<link rel="stylesheet" href="/shell.css">
<style>
.answer-choices{display:flex;gap:8px;min-height:36px;align-items:center}.answer-choices label{display:flex;align-items:center;gap:5px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;cursor:pointer;color:var(--ink);font-size:12px}.answer-choices input{width:auto;margin:0;accent-color:var(--blue)}
.head{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.head h1{font-size:18px;font-weight:500;margin:0}
.head .sub{font-size:12px;color:var(--ink2);margin-top:4px}
.head .r{margin-left:auto;display:flex;gap:8px;flex:none}
.btn{font-family:inherit;font-size:12.5px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);
  background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
.btn:hover{border-color:#b9bec6}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:#2c2f33}
.btn.mini{padding:5px 10px;font-size:11.5px}
.btn.big{padding:11px 22px;font-size:13px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:12px}
.card h2{font-size:13px;font-weight:500;margin:0 0 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 span{font-weight:400;color:var(--ink3);font-size:11.5px}
.step{font-size:11.5px;padding:5px 11px;border-radius:7px;background:#f4f5f7;color:var(--ink3)}
.step.done{background:#eaf7f1;color:#0F6E56}
.step.on{background:var(--ink);color:#fff}
#stage2 [hidden]{display:none!important}
.arw{font-size:11px;color:var(--ink3)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:flex-end}
.col{display:flex;flex-direction:column;gap:5px;flex:1;min-width:130px}
.col label{font-size:11px;color:var(--ink3)}
input,select,textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  background:#fbfcfd;outline:none;color:var(--ink);width:100%}
input:focus,select:focus{border-color:var(--blue);background:#fff}
.hint{font-size:11.5px;color:var(--ink3);line-height:1.9;margin-top:8px}
.hint b{color:var(--ink2);font-weight:500}
.big{font-size:34px;font-weight:500;letter-spacing:3px;font-variant-numeric:tabular-nums}
.qr{width:148px;height:148px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px;flex:none}
.qr img{width:100%;height:100%;display:block}
.tag{font-size:10.5px;padding:2px 7px;border-radius:5px;background:#f1f2f5;color:var(--ink2);white-space:nowrap}
.tag.ok{background:#eaf7f1;color:#0F6E56}
.tag.warn{background:#fdf3e3;color:#8a5a12}
.tag.bad{background:#fdf0ef;color:var(--red)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.crow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:1px solid transparent;cursor:pointer}
.crow:hover{background:#f8f9fb}
.crow .nm{font-size:13px}
.crow .meta{font-size:11.5px;color:var(--ink3);margin-top:2px}
.crow .rt{margin-left:auto}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#17191c;color:#fff;font-size:12.5px;
  padding:9px 16px;border-radius:9px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.empty{font-size:12.5px;color:var(--ink3);padding:14px 0;line-height:1.9}
.attendance-tabs{display:flex;gap:8px;margin:0 0 18px}.history-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.history-stats b{display:block;font-size:26px;font-weight:500;margin-bottom:6px}.history-stats span{font-size:12px;color:var(--ink3)}#attendanceHistory table{width:100%;border-collapse:collapse;font-size:12px}#attendanceHistory th{text-align:left;font-weight:400;color:var(--ink3);white-space:nowrap;padding:10px 12px;border-bottom:1px solid var(--line)}#attendanceHistory td{padding:12px;border-bottom:1px solid var(--line2);white-space:nowrap}#attendanceHistory .num{text-align:right}#attendanceHistory .mono{font-size:11px;color:var(--ink2)}#attendanceHistory .legend{font-size:11px;color:var(--ink3);margin-top:8px}@media(max-width:600px){.history-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg?v=20261026">
</head>
<body data-active="session">
<div class="app">
  <aside class="sh-side" id="shSide"></aside>
  <main class="sh-main">
    <div class="head">
      <div>
        <h1>签到管理</h1>
        <div class="sub">发起课堂签到，统一查看记录与导出出勤数据。</div>
      </div>
      <div class="r" id="headActions"></div>
    </div>

    <div class="attendance-tabs" role="group" aria-label="签到管理视图">
      <button class="btn pri" id="attendanceStartTab" type="button" aria-pressed="true" onclick="attendanceTab('start')">发起签到</button>
      <button class="btn" id="attendanceRecordsTab" type="button" aria-pressed="false" onclick="attendanceTab('records')">签到记录</button>
    </div>
    <div id="attendanceLive">
    <div class="flow-navigation">
      <nav class="flow-steps" aria-label="签到步骤">
        <span class="flow-step" data-session-step="1"><i class="flow-number">1</i>选题</span>
        <span class="flow-step" data-session-step="2"><i class="flow-number">2</i>扫码签到</span>
        <span class="flow-step" data-session-step="3"><i class="flow-number">3</i>结束归档</span>
      </nav>

    </div>
    <!-- 第一步：出题 -->
    <div id="stage1" style="display:none">
      <div class="card">
        <h2>本次签到 <span>选一门课，出一道题（也可以只签到——但至少要填题干和两个选项）</span></h2>
        <div class="row">
          <div class="col" style="max-width:300px"><label for="course">课程</label><select id="course"></select></div>
          <div class="col" style="max-width:150px"><label for="questionType">题型</label>
            <select id="questionType"><option value="single">单选题</option><option value="multiple">多选题</option></select></div>
          <div class="col" style="flex:0 1 280px"><label>正确答案</label><div id="correctChoices" class="answer-choices"></div></div>
        </div>
        <div class="row"><div class="col" style="flex:1 1 100%"><label for="qText">题目</label>
          <input id="qText" placeholder="例如：矩阵 A 可逆的充要条件是？"></div></div>
        <div class="row">
          <div class="col"><label for="o0">A</label><input id="o0"></div>
          <div class="col"><label for="o1">B</label><input id="o1"></div>
        </div>
        <div class="row" style="margin-bottom:0">
          <div class="col"><label for="o2">C</label><input id="o2"></div>
          <div class="col"><label for="o3">D</label><input id="o3"></div>
        </div>
        <div style="border-top:1px solid var(--line2);margin-top:16px;padding-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span class="hint" style="margin:0;flex:1;min-width:200px" id="startHint"></span>
          <button class="btn pri big" id="startBtn">开始签到</button>
        </div>
      </div>

      <div class="card" style="margin-bottom:0">
        <h2>最近出过的题 <span>点一下复用，不用重打</span></h2>
        <div id="recent"></div>
      </div>
    </div>

    <!-- 第二步：扫码签到 -->
    <div id="stage2" style="display:none">
      <div class="card">
        <h2 id="liveTitle">签到进行中</h2>
        <p class="hint" id="clock" style="margin:0 0 16px"></p>

        <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start">
          <div class="qr"><img id="qrImg" alt="二维码"></div>
          <div style="flex:1;min-width:250px">
            <div style="font-size:12px;color:var(--ink3)">课堂码</div>
            <div class="big" id="code">----</div>
            <div style="font-size:12.5px;color:var(--ink2);margin-top:12px" id="liveQ">—</div>
            <div style="font-size:11.5px;color:var(--ink3);margin-top:4px" id="liveOpts"></div>
            <div style="display:flex;gap:26px;margin-top:16px;flex-wrap:wrap">
              <div><div style="font-size:24px;font-weight:500" id="nPresent">0</div><div style="font-size:11px;color:var(--ink3)">已到</div></div>
              <div><div style="font-size:24px;font-weight:500;color:var(--amber)" id="nLate">0</div><div style="font-size:11px;color:var(--ink3)">迟到</div></div>
              <div><div style="font-size:24px;font-weight:500;color:var(--ink3)" id="nAbsent">0</div><div style="font-size:11px;color:var(--ink3)">未到</div></div>
              <div><div style="font-size:24px;font-weight:500;color:var(--ok)" id="nAnswered">0</div><div style="font-size:11px;color:var(--ink3)">已答题</div></div>
            </div>
          </div>
          <div style="flex:0 0 220px">
            <div style="font-size:11.5px;color:var(--ink3);margin-bottom:8px">未到名单</div>
            <div class="chips" id="absent"></div>
          </div>
        </div>

        <div style="border-top:1px solid var(--line2);margin-top:18px;padding-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <span class="hint" style="margin:0;flex:1;min-width:200px" id="liveActionsHint">无人提交时可取消，不留下签到记录；已有提交请结束并归档。</span>
          <button class="btn danger" id="cancelSessionBtn">取消本次签到</button>
          <a class="btn" href="/session?tab=records" onclick="event.preventDefault();attendanceTab('records')">查看记录</a>
          <button class="btn" id="backToArchiveBtn" hidden>返回归档结果</button>
          <button class="btn pri" id="endBtn">结束本次并归档</button>
        </div>
      </div>
    </div>

    <div id="stage3" style="display:none">
      <div class="card">
        <h2>结束归档 <span id="archiveMeta"></span></h2>
        <div id="archiveQuestion" style="font-size:18px;font-weight:500;line-height:1.7;margin-bottom:16px"></div>
        <div id="archiveAnswer" style="padding:14px 16px;background:#eaf7f1;color:#0F6E56;border-radius:10px;font-size:15px;margin-bottom:16px"></div>
        <div id="archiveOptions"></div>
        <p class="hint" id="archiveStats"></p>
        <div style="border-top:1px solid var(--line2);margin-top:18px;padding-top:14px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap">
          <a class="btn" href="/session?tab=records" onclick="event.preventDefault();attendanceTab('records')">查看签到记录</a>
          <button class="btn pri" id="againBtn">再出一道题</button>
        </div>
      </div>
    </div>
    <div class="flow-footer"><button class="flow-back" id="attendancePrev" disabled>← 上一步</button></div>
    </div>
    <section id="attendanceHistory" style="display:none" aria-label="签到记录">
      <div class="card"><div class="row" style="margin:0;align-items:center"><div class="col" style="max-width:320px"><label for="historyCourse">课程</label><select id="historyCourse"></select></div><button class="btn" id="historyExportAll" onclick="exportAttendanceCourse()">导出本课全部记录</button></div></div>
      <div id="historyContent">
        <div class="card"><h2>签到总览</h2><div class="history-stats"><div><b id="historyRate">—</b><span>平均出勤率</span></div><div><b id="historyCount">—</b><span>签到次数</span></div><div><b id="historyStudents">—</b><span>名单人数</span></div><div><b id="historyCorrect">—</b><span>平均答对率</span></div></div></div>
        <div class="card"><h2>出勤率趋势 <span>按签到时间从早到晚</span></h2><div id="historyTrend" style="overflow:auto"></div></div>
        <div class="card"><h2>历次签到 <span>按次导出答题与出勤明细</span></h2><div id="historyList" style="overflow:auto"></div></div>
        <div class="card"><h2>每人累计</h2><div id="historyPerStudent" style="overflow:auto;max-height:400px"></div></div>
      </div><p id="historyMessage" class="empty" style="display:none" role="status"></p>
    </section>
    <div id="loading" class="empty" style="display:none">加载中…</div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>
<dialog id="cancelSessionPanel" class="feedback-dialog" aria-labelledby="cancelSessionTitle" aria-describedby="cancelSessionMessage">
  <h2 id="cancelSessionTitle">取消本次签到？</h2>
  <p id="cancelSessionMessage"></p>
  <p id="cancelSessionError" role="alert" hidden></p>
  <div class="feedback-actions"><button class="btn" id="keepSessionBtn" autofocus>继续签到</button><button class="btn danger" id="confirmCancelSessionBtn">确认取消并返回选题</button></div>
</dialog>
<script src="/shell.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const qs = new URLSearchParams(location.search);
let DATA = { courses: [], students: [] }, STATE = null, ARCHIVED = null, archiveReview = false, stage = 1, timer = null, poll = null, ending = false, starting = false, cancelTargetId = null;

function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => e.classList.remove('on'), 2400); }
async function api(u, body, method, onError = toast) {
  const opt = { method: method || (body === undefined ? 'GET' : 'POST'), cache: 'no-store' };
  if (body !== undefined) { opt.headers = { 'Content-Type': 'application/json' }; opt.body = JSON.stringify(body); }
  let r, d;
  try { r = await fetch(u, opt); d = await r.json().catch(() => ({})); }
  catch (e) { onError('服务没有响应，请重试。'); return null; }
  if (!r.ok) { onError(d.error || ('操作失败 ' + r.status)); return null; }
  return d;
}
const countOf = id => DATA.students.filter(s => s.courseId === id).length;

function showStage(n) {
  stage=n;
  $('#stage1').style.display = n === 1 ? '' : 'none';
  $('#stage2').style.display = n === 2 ? '' : 'none';
  $('#stage3').style.display = n === 3 ? '' : 'none';
  $('#loading').style.display = 'none';
  document.querySelectorAll('[data-session-step]').forEach(el=>{const value=Number(el.dataset.sessionStep);el.classList.toggle('active',value===n);el.classList.toggle('complete',value<n);if(value===n)el.setAttribute('aria-current','step');else el.removeAttribute('aria-current');});
  $('#attendancePrev').disabled=n===1||(n===2&&!archiveReview&&(!STATE||STATE.present>0));
  if(n!==2)closeCancelSession();
}

/* ---------- 第一步 ---------- */
function renderStage1() {
  const courses = DATA.courses || [];
  const sel = qs.get('courseId') || '';
  $('#course').innerHTML = courses.map(c =>
    `<option value="${c.id}">${esc(c.name)}（${countOf(c.id)} 人）</option>`).join('') || '<option value="">还没有课程</option>';
  if (courses.some(c => c.id === sel)) $('#course').value = sel;
  $('#headActions').innerHTML = '';
  $('#startHint').textContent = courses.length ? '开始后二维码投到大屏，学生扫码或输课堂码。' : '还没有课程，先去「课程管理」建一门。';
  renderRecent();
  showStage(1);
}

function renderRecent() {
  const c = (DATA.courses || []).find(x => x.id === $('#course').value);
  const list = (c && c.recentQuestions) || [];
  $('#recent').innerHTML = list.length ? list.slice(0, 5).map((q, i) => `
    <div class="crow" onclick="useRecent(${i})">
      <div><div class="nm">${esc(q.text)}</div><div class="meta">${esc((q.options || []).join(' / '))}</div></div>
      <div class="rt"><span class="btn mini">复用</span></div>
    </div>`).join('') : '<div class="empty">这门课还没出过题。第一次手动出，之后就都能复用了。</div>';
  window._recent = list;
}

window.useRecent = function (i) {
  const q = (window._recent || [])[i];
  if (!q) return;
  $('#qText').value = q.text;
  for (let k = 0; k < 4; k++) $('#o' + k).value = (q.options || [])[k] || '';
  $('#questionType').value = Array.isArray(q.correct) ? 'multiple' : 'single';
  renderAnswerChoices([].concat(q.correct == null ? 0 : q.correct));
};

function renderAnswerChoices(selected = [0]) {
  const multiple = $('#questionType').value === 'multiple';
  $('#correctChoices').innerHTML = 'ABCD'.split('').map((letter,i) => `<label><input type="${multiple?'checkbox':'radio'}" name="correctAnswer" value="${i}" ${selected.includes(i)?'checked':''}>${letter}</label>`).join('');
}
$('#questionType').onchange = () => renderAnswerChoices();
renderAnswerChoices();
$('#course').onchange = renderRecent;

$('#startBtn').onclick = async () => {
  if(starting)return;
  const courseId = $('#course').value;
  if (!courseId) return toast('先选一门课程');
  const text = $('#qText').value.trim();
  const rawOptions = [0, 1, 2, 3].map(i => $('#o' + i).value.trim());
  const options = rawOptions.filter(Boolean);
  const selected = Array.from(document.querySelectorAll('[name="correctAnswer"]:checked'), el => Number(el.value));
  if (!selected.length || selected.some(i => !rawOptions[i])) return toast('请为已填写的选项设置正确答案');
  const mapped = selected.map(i => rawOptions.slice(0,i).filter(Boolean).length);
  const type = $('#questionType').value;
  if (type === 'multiple' && mapped.length < 2) return toast('多选题至少设置两个正确答案');
  if (!text) return toast('题目还没填');
  if (options.length < 2) return toast('至少填两个选项');
  starting=true;$('#startBtn').disabled=true;
  const d = await api('/api/session/start', {
    courseId,
    question: { text, options, type, correct: type === 'multiple' ? mapped : mapped[0] }
  });
  starting=false;$('#startBtn').disabled=false;
  if (d) { toast('已开始，让学生扫码'); enterLive(); }
};

/* ---------- 第二步 ---------- */
function enterLive() {
  archiveReview=false;closeCancelSession();
  STATE = null;
  showStage(2);
  $('#headActions').innerHTML = '';
  if (poll) clearInterval(poll);
  poll = setInterval(refreshState, 2000);
  if (timer) clearInterval(timer);
  timer = setInterval(tickClock, 1000);
  refreshState();
}

let REMAIN = 0;
function tickClock() {
  if (!STATE) return;
  REMAIN = Math.max(0, REMAIN - 1000);
  const m = Math.floor(REMAIN / 60000), s = Math.floor(REMAIN % 60000 / 1000);
  $('#clock').textContent = REMAIN > 0
    ? `剩余 ${m > 0 ? m + ' 分 ' : ''}${s} 秒 · 二维码每 3 秒刷新`
    : '签到窗口已结束 · 仍在补签宽限内';
}

async function refreshState() {
  if (ending) return;
  const st = await api('/api/session/state');
  if (ending || $('#stage2').style.display === 'none') return;
  if (!st || !st.active) { // 已经结束
    if (poll) clearInterval(poll), poll = null;
    if (timer) clearInterval(timer), timer = null;
    if ($('#stage2').style.display !== 'none') { toast('签到已结束'); renderStage1(); }
    return;
  }
  paintLive(st,false);
}

function paintLive(st,archived) {
  STATE = st;archiveReview=archived;
  REMAIN = st.remainMs;

  $('#liveTitle').innerHTML = `${archived?'扫码签到情况（已归档）':'签到进行中'} <span>${esc(st.course)} · ${st.total} 人</span>`;
  $('#qrImg').closest('.qr').style.display=archived?'none':'';
  if(!archived)$('#qrImg').src = '/qr.svg?t=' + Math.floor(Date.now() / 3000);
  $('#code').textContent = archived?'已归档':st.code;
  $('#cancelSessionBtn').hidden=archived;$('#endBtn').hidden=archived;$('#backToArchiveBtn').hidden=!archived;
  $('#attendancePrev').disabled=!archived&&st.present>0;
  $('#liveActionsHint').textContent=archived?'只读查看本次扫码情况，不会重新开放签到。':'无人提交时可取消，不留下签到记录；已有提交请结束并归档。';
  if(archived)$('#clock').textContent='本次签到已归档 · 仅查看，不再接受提交';
  if($('#cancelSessionPanel').open&&!archived)renderCancelMessage();
  $('#liveQ').textContent = st.question.text;
  $('#liveOpts').innerHTML = st.question.options.map((o, i) => {
    return `${'ABCDEF'[i]}. ${esc(o)}`;
  }).join('　　');
  $('#nPresent').textContent = st.present;
  $('#nLate').textContent = st.late;
  $('#nAbsent').textContent = st.absent.length;
  $('#nAnswered').textContent = st.answered;
  $('#absent').innerHTML = st.absent.length
    ? st.absent.map(a => `<span class="tag">${esc(a.name)}</span>`).join('')
    : '<span class="tag ok">全员已到</span>';
}

function renderCancelMessage(){
  const blocked=!STATE||STATE.id!==cancelTargetId||STATE.present>0;
  $('#confirmCancelSessionBtn').disabled=blocked||ending;
  $('#cancelSessionMessage').textContent=STATE&&STATE.present>0?'已有学生提交签到，不能取消或返回选题。请保留本次数据，使用“结束本次并归档”。':'确认取消本次签到？当前尚无学生提交，取消后二维码和课堂码失效，本次空记录将移除，不计入签到次数与学情分析。';
}
function closeCancelSession(){if($('#cancelSessionPanel').open)$('#cancelSessionPanel').close();cancelTargetId=null;}
function requestCancelSession(){
  if(ending||!STATE)return;
  cancelTargetId=STATE.id;$('#cancelSessionError').hidden=true;renderCancelMessage();
  if(!$('#cancelSessionPanel').open)$('#cancelSessionPanel').showModal();
  $('#keepSessionBtn').focus();
}
$('#cancelSessionBtn').onclick=requestCancelSession;
$('#keepSessionBtn').onclick=()=>{if(!ending)closeCancelSession();};
$('#cancelSessionPanel').oncancel=event=>{if(ending)event.preventDefault();else cancelTargetId=null;};
$('#confirmCancelSessionBtn').onclick=async()=>{
  if(ending||!STATE||STATE.id!==cancelTargetId||STATE.present>0)return;
  ending=true;$('#confirmCancelSessionBtn').disabled=true;$('#endBtn').disabled=true;$('#keepSessionBtn').disabled=true;$('#cancelSessionError').hidden=true;
  const d=await api('/api/session/cancel',{sessionId:cancelTargetId},'POST',message=>{const error=$('#cancelSessionError');error.textContent=message;error.hidden=false;});
  ending=false;$('#endBtn').disabled=false;$('#keepSessionBtn').disabled=false;
  if(!d){await refreshState();renderCancelMessage();return;}
  if(poll)clearInterval(poll),poll=null;if(timer)clearInterval(timer),timer=null;
  STATE=null;closeCancelSession();showStage(1);$('#startBtn').focus();
  toast('已取消本次签到，空记录已移除；题目保留，可修改后重新发起');
};
$('#attendancePrev').onclick=()=>{
  if(stage===3&&ARCHIVED){archiveReview=true;showStage(2);paintLive(ARCHIVED,true);}
  else if(stage===2&&archiveReview){archiveReview=false;showStage(1);}
  else if(stage===2)requestCancelSession();
};
$('#backToArchiveBtn').onclick=()=>{if(ARCHIVED)renderArchive(ARCHIVED);};

$('#endBtn').onclick = async () => {
  if (ending) return;
  ending = true;
  $('#endBtn').disabled = true;
  const d = await api('/api/session/end', {});
  ending = false;
  $('#endBtn').disabled = false;
  if (d) {
    if (poll) clearInterval(poll), poll = null;
    if (timer) clearInterval(timer), timer = null;
    toast('已归档，可在签到记录里查看');
    if (d.session) renderArchive(d.session);
    else { toast('本次签到已结束，请在签到记录中查看'); renderStage1(); }
  }
};

function renderArchive(st) {
  ARCHIVED=st;archiveReview=false;
  const correct = [].concat(st.question.correct);
  $('#archiveMeta').textContent = `${st.course} · 已归档`;
  $('#archiveQuestion').textContent = st.question.text;
  $('#archiveAnswer').textContent = '正确答案：' + correct.map(i => 'ABCDEF'[i]).join('、');
  $('#archiveOptions').innerHTML = st.question.options.map((o,i) => {
    const good = correct.includes(i);
    return `<div style="display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line2);font-size:14px;${good?'color:#0F6E56;font-weight:500':''}"><span>${'ABCDEF'[i]}. ${esc(o)}${good?'（正确）':''}</span><span style="font-size:12px;color:var(--ink3);white-space:nowrap">${st.dist[i] || 0} 人选择</span></div>`;
  }).join('');
  $('#archiveStats').textContent = `已签到 ${st.present} / ${st.total} 人 · 已答题 ${st.answered} 人 · 正确率 ${st.answered ? Math.round(st.correct / st.answered * 100) + '%' : '—'}`;
  showStage(3);
}

$('#againBtn').onclick = async () => {
  const fresh = await api('/api/all');
  if (fresh) DATA = fresh;
  STATE = null;
  renderStage1();
};


let attendanceView='start',historyVersion=0,attendanceStats=null;
const fmtTime = time => new Date(time).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
function attendanceTab(view) {
  attendanceView=view==='records'?'records':'start';
  const records=attendanceView==='records';
  $('#attendanceLive').style.display=records?'none':'';
  $('#attendanceHistory').style.display=records?'':'none';
  for(const [id,on] of [['attendanceStartTab',!records],['attendanceRecordsTab',records]]){
    $("#"+id).classList.toggle('pri',on);$("#"+id).setAttribute('aria-pressed',String(on));
  }
  const url=new URL(location.href);if(records)url.searchParams.set('tab','records');else url.searchParams.delete('tab');history.replaceState(null,'',url);
  if(records){
    const select=$('#historyCourse'),prior=select.value||$('#course').value||qs.get('courseId');
    select.innerHTML=(DATA.courses||[]).map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
    if((DATA.courses||[]).some(c=>c.id===prior))select.value=prior;
    loadAttendanceHistory();
  }
}
async function loadAttendanceHistory() {
  const version=++historyVersion,id=$('#historyCourse').value;
  attendanceStats=null;$('#historyContent').style.display='none';$('#historyMessage').style.display='';$('#historyExportAll').disabled=true;
  $('#historyMessage').textContent=id?'正在加载签到记录…':'还没有课程，先到课程管理创建课程。';
  if(!id)return;
  const st=await api('/api/stats/course?courseId='+encodeURIComponent(id));
  if(version!==historyVersion||id!==$('#historyCourse').value)return;
  if(!st){$('#historyMessage').textContent='记录加载失败，请重新选择课程重试。';return;}
  attendanceStats=st;$('#historyContent').style.display='';$('#historyMessage').style.display='none';
  $('#historyRate').textContent=st.sessions.length?st.overall.rate+'%':'—';$('#historyCount').textContent=st.overall.count;$('#historyStudents').textContent=st.roster;
  const answered=st.sessions.filter(s=>s.correctRate!=null);$('#historyCorrect').textContent=answered.length?Math.round(answered.reduce((n,s)=>n+s.correctRate,0)/answered.length)+'%':'—';
  renderAttendanceTrend(st.sessions.slice().reverse());renderAttendanceSessions(st.sessions);renderAttendanceStudents(st.perStudent);
  $('#historyExportAll').disabled=!st.sessions.length;
}
function exportAttendanceCourse(){if(!attendanceStats||!attendanceStats.sessions.length)return;location.href='/api/export.xlsx?courseId='+encodeURIComponent(attendanceStats.course.id);}
$('#historyCourse').onchange=loadAttendanceHistory;

function renderAttendanceTrend(list) {
  if (!list.length) {
    $('#historyTrend').innerHTML = '<div class="empty">这门课还没有点名记录。上完一节课、结束一次点名，这里就出图了。</div>';
    return;
  }
  const bw = 34, gap = 18, step = bw + gap;
  const padL = 34, padR = 12, padT = 22, padB = 40;
  const H = 188;
  const W = Math.max(360, padL + padR + list.length * step);
  const ph = H - padT - padB;
  const y = v => padT + ph - ph * (v / 100);

  const grid = [0, 50, 100].map(v => `
    <line x1="${padL}" y1="${y(v)}" x2="${W - padR}" y2="${y(v)}" stroke="#eceef1" stroke-width="1"/>
    <text x="${padL - 7}" y="${y(v) + 3.5}" text-anchor="end" font-size="9.5" fill="#b9bec6">${v}</text>`).join('');

  const bars = list.map((s, i) => {
    const x = padL + i * step + gap / 2;
    const bh = Math.max(2, ph * (s.rate / 100));
    const col = s.rate >= 90 ? '#1D9E75' : s.rate >= 70 ? '#378ADD' : '#BA7517';
    const d = new Date(s.startedAt);
    const lab = `${d.getMonth() + 1}/${d.getDate()}`;
    return `
      <g>
        <title>${fmtTime(s.startedAt)}　到课 ${s.present}/${s.total}（${s.rate}%）</title>
        <rect x="${x}" y="${padT}" width="${bw}" height="${ph}" fill="#f7f8fa" rx="3"/>
        <rect x="${x}" y="${y(s.rate)}" width="${bw}" height="${bh}" fill="${col}" rx="3"/>
        <text x="${x + bw / 2}" y="${y(s.rate) - 6}" text-anchor="middle" font-size="10" fill="#666b73">${s.rate}%</text>
        <text x="${x + bw / 2}" y="${H - padB + 16}" text-anchor="middle" font-size="9.5" fill="#9aa0a8">${lab}</text>
        <text x="${x + bw / 2}" y="${H - padB + 29}" text-anchor="middle" font-size="9" fill="#c3c7cd">${s.present}/${s.total}</text>
      </g>`;
  }).join('');

  $('#historyTrend').innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${grid}${bars}</svg>`
    + '<div class="legend">柱子上是出勤率，下方是「到课/应到」。低于 70% 显示黄色。</div>';
}

function renderAttendanceSessions(list) {
  if (!list.length) { $('#historyList').innerHTML = '<div class="empty">还没有点名记录</div>'; return; }
  $('#historyList').innerHTML = `<table>
    <thead><tr><th>时间</th><th>题目</th><th class="num">到课</th><th class="num">迟到</th><th class="num">出勤率</th><th class="num">答对率</th><th></th></tr></thead>
    <tbody>${list.map(s => {
      const cls = s.rate >= 90 ? 'ok' : s.rate >= 70 ? '' : 'warn';
      return `<tr>
        <td class="mono">${fmtTime(s.startedAt)}</td>
        <td title="${esc(s.question)}">${esc(s.question.slice(0, 26))}${s.question.length > 26 ? '…' : ''}</td>
        <td class="num">${s.present}/${s.total}</td>
        <td class="num">${s.late}</td>
        <td class="num"><span class="tag ${cls}">${s.rate}%</span></td>
        <td class="num">${s.correctRate == null ? '—' : s.correctRate + '%'}</td>
        <td style="text-align:right"><a class="btn mini" href="/api/export.xlsx?sessionId=${s.id}">导出</a></td>
      </tr>`;
    }).join('')}</tbody></table>`;
}

function renderAttendanceStudents(list) {
  if (!list.length) { $('#historyPerStudent').innerHTML = '<div class="empty">这门课还没有名单</div>'; return; }
  $('#historyPerStudent').innerHTML = `<table>
    <thead><tr><th>学号</th><th>姓名</th><th class="num">出勤</th><th class="num">缺勤</th><th class="num">迟到</th><th class="num">出勤率</th><th class="num">答对率</th></tr></thead>
    <tbody>${list.map(s => {
      const bad = s.total > 0 && s.rate < 60;
      return `<tr>
        <td class="mono">${esc(s.id)}</td>
        <td style="${bad ? 'color:#A32D2D' : ''}">${esc(s.name)}</td>
        <td class="num">${s.attended}/${s.total}</td>
        <td class="num" style="${s.absent ? 'color:#A32D2D' : ''}">${s.absent}</td>
        <td class="num">${s.late}</td>
        <td class="num"><span class="tag ${bad ? 'bad' : s.rate >= 90 ? 'ok' : ''}">${s.total ? s.rate + '%' : '—'}</span></td>
        <td class="num">${s.correctRate == null ? '—' : s.correctRate + '%'}</td>
      </tr>`;
    }).join('')}</tbody></table>`;
}


/* ---------- 启动 ---------- */
(async function boot() {
  $('#loading').style.display = '';
  DATA = (await api('/api/all')) || { courses: [], students: [] };
  const st = await api('/api/session/state');
  if (st && st.active) { enterLive(); }
  else renderStage1();
  attendanceTab(qs.get('tab')==='records'?'records':'start');
})();
</script>
</body>
</html>
