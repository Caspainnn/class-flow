<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>教案制作 · 一堂课</title><link rel="icon" href="/assets/logo.svg"><link rel="stylesheet" href="/shell.css"><link rel="stylesheet" href="/vendor/element-upload.css"><link rel="stylesheet" href="/lesson-plan.css"></head>
<body class="shelled" data-active="plan"><div class="app"><aside class="sh-side" id="shSide"></aside><main class="sh-main"><header class="page-head"><div><h1>教案制作</h1><p class="sub">把教学想法整理成可编辑、可复用的教学设计</p></div><button id="newTask" class="primary">新建教案</button></header><div id="banner" role="alert" hidden></div><div id="root"></div></main></div>
<div id="toast" role="status" hidden></div>
<dialog id="confirm" aria-labelledby="confirmTitle"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div id="confirmError" class="alert error" role="alert" hidden></div><div class="dialog-actions"><button id="safe" autofocus>继续编辑</button><button id="risk" class="danger">确认</button></div></dialog>
<dialog id="versionDialog" aria-labelledby="versionDialogTitle"><form id="versionForm" novalidate><h2 id="versionDialogTitle">保存版本</h2><p id="versionDescription">将当前整份教案保存为新的 Word 版本。</p><div class="field"><label for="versionName">版本名称</label><input id="versionName" maxlength="80" required autocomplete="off" aria-describedby="versionNameError"><div id="versionNameError" class="inline-error" hidden></div></div><div id="versionSaveError" class="alert error" role="alert" hidden></div><div class="dialog-actions"><button id="cancelVersion" type="button">取消</button><button id="confirmVersion" class="primary" type="submit">保存版本</button></div></form></dialog>
<script src="/shell.js"></script><script src="/vendor/element-upload.js"></script><script src="/lesson-plan.js"></script></body></html>
