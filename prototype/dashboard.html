<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据看板 · 一堂课</title><link rel="stylesheet" href="dashboard.css"></head>
<body><aside class="sidebar"><a class="brand" href="#overview"><span>一</span>一堂课<small>教学工作空间</small></a><div class="nav-label">概览</div><a href="http://127.0.0.1:3000/">▤ <span>工作台</span></a><a class="active" href="#overview">▦ <span>数据看板</span><i></i></a><div class="nav-label">课前准备</div><a href="http://127.0.0.1:3000/courses">☰ <span>课程管理</span></a><a href="http://127.0.0.1:3000/preparation?type=ppt">▧ <span>PPT管理</span></a><a href="http://127.0.0.1:3000/preparation?type=plan">✎ <span>教案制作</span></a><div class="nav-label">课堂与反馈</div><a href="http://127.0.0.1:3000/session">◉ <span>签到管理</span></a><a href="http://127.0.0.1:3000/xueqing?tab=warn">⚑ <span>学情分析</span></a><a href="http://127.0.0.1:3000/questionnaires">▤ <span>问卷管理</span></a><a href="http://127.0.0.1:3000/homework">✓ <span>作业管理</span></a><div class="side-foot"><span class="dot"></span> 本机教学空间<small>数据看板 · 交互原型</small></div></aside>
<main><div class="eyebrow">工作空间 <span>/</span> 教学洞察 <b>示例数据</b></div><header><div><h1>数据看板</h1><p>课堂参与、作业进展与学生反馈，一屏掌握关键变化。</p></div><div class="header-actions"><span id="syncTime">尚未刷新</span><button id="refresh"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 8a8 8 0 1 0 0 8M20 3v5h-5"/></svg> 刷新数据</button></div></header>
<section class="filters" aria-label="统计筛选"><label>课程<select id="course"><option value="all">全部课程</option><option value="math">高等数学（上）</option><option value="ai">人工智能安全</option><option value="empty">新建课程 · 无记录</option></select></label><label>学期<select id="term"><option value="all">全部学期</option><option value="2026">2026–2027 秋季</option><option value="2025">2025–2026 春季 · 无记录</option></select></label><label>活动日期<select id="period"><option value="30">近30天</option><option value="7">近7天</option><option value="all">全部</option><option value="custom">自定义</option></select></label><div id="customDates" hidden><input aria-label="开始日期" id="from" type="date" value="2026-10-01"><span>至</span><input aria-label="结束日期" id="to" type="date" value="2026-10-31"></div><span class="filter-note">存量指标按当前统计</span></section><p id="dateError" class="error" role="alert" hidden></p>
<div id="content"></div>
<footer><span>交互原型 · 全部数值为虚构示例，不读取正式教学数据</span><button id="simulateError" class="text-button">演示加载失败</button></footer></main>
<dialog id="detail" aria-labelledby="detailTitle"><div class="dialog-head"><div><small>数据明细 · 示例</small><h2 id="detailTitle"></h2></div><button id="closeDetail" aria-label="关闭明细">✕</button></div><div id="detailBody"></div><div class="dialog-foot"><button id="doneDetail">返回看板</button></div></dialog><div id="toast" role="status" hidden></div><script src="dashboard.js"></script></body></html>
