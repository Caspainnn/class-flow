<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作台 · 一堂课</title>
<style>
:root{--ink:#17191c;--ink2:#666b73;--ink3:#9aa0a8;--line:#e6e8ec;--line2:#f2f3f5;
  --bg:#f4f5f7;--blue:#185FA5;--ok:#1D9E75;--red:#A32D2D;--amber:#BA7517}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;font-size:13px}
.app{display:flex;height:100vh;overflow:hidden}

/* 侧边栏 */
.side{width:212px;flex:none;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:16px 10px 10px}
.brand{display:flex;align-items:center;gap:8px;padding:2px 8px 12px}
.logo{width:24px;height:24px;border-radius:7px;background:var(--ink);color:#fff;font-size:12px;
  display:flex;align-items:center;justify-content:center;flex:none}
.brand .t{font-size:13.5px;font-weight:500}
.brand .v{font-size:10px;color:var(--ink3);margin-left:auto}
.nav{flex:1;overflow:auto;margin:0 -4px;padding:0 4px 6px}
.grp{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink3);
  padding:12px 10px 6px;letter-spacing:.3px}
.grp b{font-weight:500;color:var(--ink2);font-size:11px}
.grp .ln{flex:1;height:1px;background:var(--line2)}
.nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;
  color:var(--ink2);text-decoration:none;font-size:12.5px;margin-bottom:1px;cursor:pointer}
.nav a:hover{background:#f4f6f8;color:var(--ink)}
.nav a.on{background:#eef2f7;color:var(--blue);font-weight:500}
.nav a .ico{width:14px;text-align:center;font-size:11.5px;flex:none;opacity:.75}
.nav a .n{margin-left:auto;font-size:10.5px;color:var(--red)}
.nav a .soon{margin-left:auto;font-size:10px;color:var(--ink3);border:1px dashed var(--line);border-radius:4px;padding:0 4px}
.nav a.sub{padding-left:30px;font-size:12px}
.nav a.par{color:var(--ink);font-weight:500}
.sideFt{border-top:1px solid var(--line2);padding:9px 10px 2px;font-size:11px;color:var(--ink3);
  display:flex;align-items:center;gap:6px}
.sideFt i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block}

/* 内容区 */
.main{flex:1;overflow:auto;padding:24px 26px 48px}
.crumb{font-size:11.5px;color:var(--ink3);margin-bottom:6px}
.head{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.head h1{font-size:18px;font-weight:500}
.head .sub{font-size:12px;color:var(--ink2);margin-top:4px;line-height:1.6;max-width:560px}
.head .r{margin-left:auto;display:flex;gap:8px;flex:none}
.btn{font-family:inherit;font-size:12.5px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);
  background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#b9bec6}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:#2c2f33}
.btn.mini{padding:5px 10px;font-size:11.5px}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:12px}
.card h2{font-size:13px;font-weight:500;margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 span{font-weight:400;color:var(--ink3);font-size:11.5px}
.card h2 .more{margin-left:auto;font-size:11.5px;color:var(--blue);cursor:pointer;font-weight:400}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 16px}
.stat b{display:block;font-size:24px;font-weight:500;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--ink3);display:block;margin-top:2px}
.stat.link{cursor:pointer}
.stat.link:hover{border-color:#c9ced6}

.crow{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.crow:hover{background:#f8f9fb}
.crow.on{background:#f4f7fb;border-color:#dbe5f0}
.crow .k{width:22px;height:22px;border-radius:6px;background:#f1f2f5;color:var(--ink3);font-size:11.5px;
  display:flex;align-items:center;justify-content:center;flex:none}
.crow .nm{font-size:13.5px;font-weight:500}
.crow .meta{font-size:11.5px;color:var(--ink3);margin-top:2px}
.crow .rt{margin-left:auto;font-size:11px;color:var(--ink3);display:flex;align-items:center;gap:10px}
.tag{font-size:10.5px;padding:2px 7px;border-radius:5px;background:#f1f2f5;color:var(--ink2);white-space:nowrap}
.tag.ok{background:#eaf7f1;color:#0F6E56}
.tag.bad{background:#fdf0ef;color:var(--red)}
.tag.warn{background:#fdf3e3;color:#8a5a12}
.tag.info{background:#edf3fa;color:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:400;color:var(--ink3);font-size:11px;padding:0 8px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line2)}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
input,select,textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fbfcfd;outline:none;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--blue);background:#fff}
textarea{min-height:80px;line-height:1.7;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:flex-end}
.col{display:flex;flex-direction:column;gap:5px;flex:1;min-width:130px}
.col label{font-size:11px;color:var(--ink3)}
.todo{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.todo:last-child{border-bottom:none}
.todo .d{width:7px;height:7px;border-radius:50%;flex:none}
.todo .go{margin-left:auto;font-size:11.5px;color:var(--blue);cursor:pointer}
.hint{font-size:11.5px;color:var(--ink3);line-height:1.9;margin-top:8px}
.hint b{color:var(--ink2);font-weight:500}
.placeholder{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:34px 20px;text-align:center;color:var(--ink3)}
.placeholder .t{font-size:13px;color:var(--ink2);margin-bottom:6px}
.placeholder .s{font-size:11.5px;line-height:1.8;max-width:420px;margin:0 auto}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fn{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 15px;cursor:pointer;
  display:flex;align-items:center;gap:10px;transition:border-color .12s,box-shadow .12s}
.fn:hover{border-color:#c9ced6;box-shadow:0 2px 8px rgba(23,25,28,.04)}
.fn .fi{width:26px;height:26px;border-radius:7px;background:#f4f6f8;display:flex;align-items:center;
  justify-content:center;font-size:12px;color:var(--ink2);flex:none}
.fn .ft{font-size:12.5px;font-weight:500}
.fn .fd{font-size:10.5px;color:var(--ink3);margin-top:1px}
.step{font-size:11.5px;padding:5px 11px;border-radius:7px;background:#f4f5f7;color:var(--ink3)}
.step.done{background:#eaf7f1;color:#0F6E56}
.step.on{background:var(--ink);color:#fff}
.arw{font-size:11px;color:var(--ink3)}
.qr{width:132px;height:132px;background:#fff;border:1px solid var(--line);border-radius:8px;
  display:grid;grid-template-columns:repeat(9,1fr);gap:2px;padding:8px}
.qr i{background:#17191c;border-radius:1px}
.qr i.w{background:transparent}
.big{font-size:34px;font-weight:500;letter-spacing:3px;font-variant-numeric:tabular-nums}
@media (max-width:1180px){.stats{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr}}
@media (max-width:820px){.side{display:none}.main{padding:18px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo">课</span><span class="t">一堂课</span><span class="v">v3</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="sideFt"><i></i>服务运行中 · 3000</div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
/* ============ 导航结构：课前 / 课中 / 课后 + 设置 ============ */
const NAV = [
  { grp: '概览', items: [{ k: 'home', t: '工作台', ico: '▤' }] },
  { grp: '课前', items: [
    { k: 'pre-course', t: '课程与名单', ico: '☰' },
    { k: 'pre-plan', t: '课堂准备', ico: '✎', soon: true },
  ]},
  { grp: '课中', items: [
    { k: 'live-start', t: '发起签到', ico: '◉', n: '进行中' },
  ]},
  { grp: '课后', items: [
    { k: 'xq-dash', t: '学情分析', ico: '▦', par: true },
    { k: 'xq-warn', t: '预警名单', sub: true, n: '3' },
    { k: 'xq-stu', t: '个体画像', sub: true },
    { k: 'xq-prac', t: '练习分析', sub: true },
    { k: 'hw', t: '作业录入', ico: '✎' },
    { k: 'records', t: '签到记录', ico: '↧' },
    { k: 'export', t: '导出中心', ico: '⇩' },
  ]},
  { grp: '设置', items: [
    { k: 'rules', t: '预警规则', ico: '⚑' },
    { k: 'sys', t: '系统设置', ico: '⚙' },
    { k: 'backup', t: '数据与备份', ico: '⛁' },
  ]},
];
const CRUMB = { home:'概览 / 工作台', 'pre-course':'课前 / 课程与名单', 'pre-plan':'课前 / 课堂准备',
  'live-start':'课中 / 发起签到',
  'xq-dash':'课后 / 学情分析 / 数据看板', 'xq-warn':'课后 / 学情分析 / 预警名单',
  'xq-stu':'课后 / 学情分析 / 个体画像', 'xq-prac':'课后 / 学情分析 / 练习分析',
  hw:'课后 / 作业录入', records:'课后 / 签到记录', export:'课后 / 导出中心',
  rules:'设置 / 预警规则', sys:'设置 / 系统设置', backup:'设置 / 数据与备份' };

let CUR = 'home';

function renderNav(){
  document.getElementById('nav').innerHTML = NAV.map(g=>{
    const items = g.items.map(it=>{
      const n = it.n ? `<span class="n">${it.n}</span>`:'';
      const soon = it.soon ? '<span class="soon">规划中</span>':'';
      const cls = ['', it.sub?'sub':'', it.par?'par':'', it.k===CUR?'on':''].join(' ').trim();
      return `<a class="${cls}" onclick="go('${it.k}')"><span class="ico">${it.ico||''}</span>${it.t}${n}${soon}</a>`;
    }).join('');
    return `<div class="grp"><b>${g.grp}</b><span class="ln"></span></div>${items}`;
  }).join('');
}

/* ============ 各板块内容 ============ */
const C = {};

C.home = {
  title: '工作台',
  sub: '10月23日 周五 · 今天 2 节课，还有 3 项待办',
  right: `<button class="btn" onclick="go('pre-course')">导入名单</button>
          <button class="btn pri" onclick="go('live-start')">发起签到</button>`,
  body: `
  <div class="stats">
    <div class="stat"><b>2</b><span>今天还有课</span></div>
    <div class="stat link" onclick="go('xq-warn')"><b style="color:var(--red)">3</b><span>待关注学生</span></div>
    <div class="stat link" onclick="go('hw')"><b style="color:var(--amber)">1</b><span>作业待录入</span></div>
    <div class="stat"><b>11</b><span>本周已上课次</span></div>
  </div>

  <div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">
    <div class="card" style="flex:1.4;min-width:320px">
      <h2>待办 <span>按紧急程度排</span></h2>
      <div class="todo"><span class="d" style="background:var(--red)"></span><span>「高等数学（上）」第 3 次点名还没结束（43/47）</span><span class="go" onclick="go('live-start')">回到签到 →</span></div>
      <div class="todo"><span class="d" style="background:var(--amber)"></span><span>线性代数第 2 次作业还没录入得分</span><span class="go" onclick="go('hw')">去录入 →</span></div>
      <div class="todo"><span class="d" style="background:var(--blue)"></span><span>2 名学生连续缺勤 2 次，课后看一眼画像</span><span class="go" onclick="go('xq-stu')">看画像 →</span></div>
    </div>
    <div class="card" style="flex:1;min-width:280px">
      <h2>今天的课</h2>
      <div class="crow on" onclick="go('live-start')">
        <span class="k">1</span>
        <div><div class="nm">高等数学（上）</div><div class="meta">08:00 · 教三 301 · 47 人</div></div>
        <div class="rt"><span class="tag info">进行中 43/47</span></div>
      </div>
      <div class="crow">
        <span class="k">2</span>
        <div><div class="nm">线性代数</div><div class="meta">14:00 · 教二 205 · 40 人</div></div>
        <div class="rt"><span>5 小时后</span></div>
      </div>
      <div class="crow">
        <span class="k">3</span>
        <div><div class="nm">概率论与数理统计</div><div class="meta">19:00 · 教三 108 · 38 人</div></div>
        <div class="rt"><span>今晚</span></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>常用功能 <span>点一下直达</span></h2>
    <div class="grid3">
      <div class="fn" onclick="go('live-start')"><span class="fi">◉</span><div><div class="ft">发起签到</div><div class="fd">选课出题 · 投影扫码</div></div></div>
      <div class="fn" onclick="go('xq-dash')"><span class="fi">▦</span><div><div class="ft">学情分析</div><div class="fd">数据看板 · 趋势</div></div></div>
      <div class="fn" onclick="go('xq-warn')"><span class="fi">⚑</span><div><div class="ft">预警名单</div><div class="fd">3 人待关注</div></div></div>
      <div class="fn" onclick="go('hw')"><span class="fi">✎</span><div><div class="ft">作业录入</div><div class="fd">粘贴学号分数</div></div></div>
      <div class="fn" onclick="go('records')"><span class="fi">↧</span><div><div class="ft">签到记录</div><div class="fd">历次到课明细</div></div></div>
      <div class="fn" onclick="go('export')"><span class="fi">⇩</span><div><div class="ft">导出中心</div><div class="fd">Excel 交付</div></div></div>
      <div class="fn" onclick="go('pre-course')"><span class="fi">☰</span><div><div class="ft">课程与名单</div><div class="fd">建课 · 导名单</div></div></div>
      <div class="fn" onclick="go('xq-prac')"><span class="fi">▤</span><div><div class="ft">练习分析</div><div class="fd">课堂题 + 作业</div></div></div>
      <div class="fn" onclick="go('rules')"><span class="fi">⚙</span><div><div class="ft">预警规则</div><div class="fd">阈值设置</div></div></div>
    </div>
  </div>

  <div class="card" style="margin-bottom:0">
    <h2>最近一次点名 <span>10-22 20:15 · 高等数学（上）</span></h2>
    <div style="display:flex;gap:26px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)">
      <span>到课 <b style="color:var(--ink)">45</b>/47</span>
      <span>迟到 <b style="color:var(--amber)">2</b></span>
      <span>答题 42 人</span>
      <span>答对率 <b style="color:var(--ok)">71%</b></span>
      <span style="margin-left:auto"><a href="#" onclick="go('records');return false" style="color:var(--blue);text-decoration:none">查看记录 →</a></span>
    </div>
  </div>`
};

C['pre-course'] = {
  title: '课程与名单',
  sub: '课前准备：一门课建一次，名单导入后整学期复用。',
  right: `<button class="btn">上传 xlsx / csv</button><button class="btn pri">新增课程</button>`,
  body: `
  <div class="card">
    <h2>课程 <span>3 门 · 共 125 人</span></h2>
    <div class="crow on"><span class="k">1</span><div><div class="nm">高等数学（上）</div><div class="meta">47 人 · 2026 秋 · 已上 11 次</div></div><div class="rt"><span class="tag ok">名单完整</span><button class="btn mini">名单</button></div></div>
    <div class="crow"><span class="k">2</span><div><div class="nm">线性代数</div><div class="meta">40 人 · 2026 秋 · 已上 6 次</div></div><div class="rt"><span class="tag ok">名单完整</span><button class="btn mini">名单</button></div></div>
    <div class="crow"><span class="k">3</span><div><div class="nm">概率论与数理统计</div><div class="meta">38 人 · 2026 秋 · 已上 3 次</div></div><div class="rt"><span class="tag warn">2 人姓名待核</span><button class="btn mini">名单</button></div></div>
  </div>
  <div class="card">
    <h2>名单导入 <span>粘贴或上传，学号 + 姓名两列</span></h2>
    <div class="row"><div class="col" style="flex:1 1 100%"><label>粘贴名单 · 一行一条，逗号 / 空格 / Tab 都认</label>
      <textarea placeholder="2026110998,杨佳林&#10;2026110999,李晓明"></textarea></div></div>
    <div class="row" style="margin-bottom:0"><div class="col" style="flex:0 0 auto"><button class="btn pri">导入粘贴的名单</button></div>
      <div class="col" style="flex:1"></div><div class="col" style="flex:0 0 auto"><button class="btn">清空本课名单</button></div></div>
  </div>`
};

C['pre-plan'] = {
  title: '课堂准备',
  sub: '课前预置本节要讲的题、想提问的学生，上课时一键调出。',
  body: `<div class="placeholder">
    <div class="t">这块还没做</div>
    <div class="s">规划中的形态：课前把 2–3 道题和想提问的名单先放进来，<br>课上「发起签到」直接选题，不用现场打字。</div>
  </div>`
};

C['live-start'] = {
  title: '发起签到',
  sub: '一个流程走到底：选题 → 学生扫码 → 结束归档，全程不离开讲台。',
  body: `
  <div class="card">
    <h2>本次签到 <span>高等数学（上） · 47 人 · 08:02 开始</span></h2>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap">
      <span class="step done">① 选题</span><span class="arw">→</span>
      <span class="step on">② 扫码签到</span><span class="arw">→</span>
      <span class="step">③ 结束归档</span>
      <span style="margin-left:auto;font-size:11.5px;color:var(--ink3)">剩余 38 秒 · 二维码每 3 秒刷新</span>
    </div>

    <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start">
      <div class="qr">${Array.from({length:81},(_,i)=>`<i class="${(i*7+i*i)%5<2?'':'w'}"></i>`).join('')}</div>
      <div style="flex:1;min-width:250px">
        <div style="font-size:12px;color:var(--ink3)">课堂码</div>
        <div class="big">4821</div>
        <div style="font-size:12.5px;color:var(--ink2);margin-top:12px">矩阵 A 可逆的充要条件是？</div>
        <div style="font-size:11.5px;color:var(--ink3);margin-top:4px">
          A. |A| = 0　　B. r(A) < n　　<span style="color:var(--ok)">C. |A| ≠ 0（正确）</span>　　D. A 是对称矩阵
        </div>
        <div style="display:flex;gap:26px;margin-top:16px;flex-wrap:wrap">
          <div><div style="font-size:24px;font-weight:500">43<span style="font-size:13px;color:var(--ink3)">/47</span></div><div style="font-size:11px;color:var(--ink3)">已到</div></div>
          <div><div style="font-size:24px;font-weight:500;color:var(--amber)">2</div><div style="font-size:11px;color:var(--ink3)">迟到</div></div>
          <div><div style="font-size:24px;font-weight:500;color:var(--ink3)">4</div><div style="font-size:11px;color:var(--ink3)">未到</div></div>
          <div><div style="font-size:24px;font-weight:500;color:var(--ok)">41</div><div style="font-size:11px;color:var(--ink3)">已答题</div></div>
